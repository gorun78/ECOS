name: ECOS CLI CI

# 与 ecos-ci.yml 隔离，降低后端全量构建的回归面。
on:
  push:
    branches: [main, develop]
    paths:
      - 'tools/ecos-cli/**'
      - 'docs/10-架构/api-contracts/**'
      - 'ecos_backend/gateway/src/test/java/com/chinacreator/gzcm/gateway/arch/CliContractParityTest.java'
      - '.github/workflows/ecos-cli-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/ecos-cli/**'
      - 'docs/10-架构/api-contracts/**'
      # 与 push 侧保持对称：只改跨模块契约门禁本身时也必须跑 cli-contract，
      # 否则「把门禁改松」的 PR 恰好不会触发该 job。
      - 'ecos_backend/gateway/src/test/java/com/chinacreator/gzcm/gateway/arch/CliContractParityTest.java'
      - '.github/workflows/ecos-cli-ci.yml'

jobs:
  # ① CLI 工程自身：编译 + 全量单测（含契约清单一致性与硬化用例）
  cli-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify CLI project
        # build.id 注入短 sha：--version 输出 "<版本> (<sha>)"（与 dist/build.sh 同口径）
        run: mvn -f tools/ecos-cli/pom.xml verify -B -Dbuild.id="$(git rev-parse --short=8 HEAD)"

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: ecos-cli-jar
          path: tools/ecos-cli/target/ecos-cli.jar
          retention-days: 5

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-surefire-reports
          path: tools/ecos-cli/target/surefire-reports/**
          retention-days: 5

  # ② 契约一致性门禁（需要仓根 + ecos_backend + CLI 命令树三面同时可见，故只在 gateway 侧跑）
  cli-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # gateway 测试类路径同时含契约 YAML、CLI 清单与全部 Controller 源码。
      # -am 会连上游模块一并 test，而它们没有同名用例 ⇒ 必须关掉 failIfNoSpecifiedTests，
      # 否则 surefire 在 common-api 阶段就报 "No tests matching pattern" 直接失败。
      - name: CliContractParityTest
        working-directory: ecos_backend
        run: mvn -pl gateway -am test -Dtest='CliContractParityTest' -Dsurefire.failIfNoSpecifiedTests=false -B

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-gate-reports
          path: ecos_backend/gateway/target/surefire-reports/**
          retention-days: 5

# ③ 活体 E2E —— 不纳入本仓 CI（2026-11-11 用户裁决）
#
# 本 job 曾以「起 PG + 起网关 + 跑 ecos-tests --project=api」的形式存在，但仓内没有可复现的
# 「从零建库」基线，它在此之前必然红，故移除而非留一个常红 job 污染信号。
#
# 为什么建不起来（实测，非推断）：
#   docs/50-db_script/02-flyway-migration/gateway 的 278 枚迁移是一条**增量补丁链**，假设库里
#   已存在一份**仓外**建立的 schema 基线。空库按版本序全量跑（生产同款 search_path）：
#     · 裸跑链                  → OK=143 / FAIL=136
#     · 仅先建 10 个 schema     → OK=213 / FAIL=66   （90 个失败纯因 schema 未创建）
#     · ST07 基线 + 链          → OK=222 / FAIL=56
#     · ST07 + public 锚表 + 链 → OK=214 / FAIL=56   （互为干扰，混合路线已证伪）
#   首批失败自链头即出现：V4.4 要 `ALTER TABLE ecos_ontology`，而全链无 `CREATE TABLE ecos_ontology`。
#   `ecos-docker/initdb/` 为空、`apply-migrations.sh` 读仓外 /tmp/migrations、Testcontainers 仅声明未用。
#   按铁律 §3.1「DDL 单源」，不得把 pg_dump 基线提为第二源 ⇒ 修复需先改铁律口径，属独立立项。
#   根因与四组实测数据见 docs/40-实现/从零建库审计报告-2026-11-11.md。
#
# 替代覆盖（CI 内）：cli-build 的 CLI 单测 + cli-contract 的跨模块契约门禁，二者不依赖数据库。
# 需要活体回归时在已引导的开发机上手动执行：
#   cd ecos-tests && npx playwright test --project=api    # 需网关 :8080 + 前端 :3000
# 本机实测口径（既有 dev 库，已引导）：20 passed / 2 skipped。
