server:
  # PMO-49 P2-6: workspace 场景层端口 18090 (独立于 5 业务 service, 方案 v1.4)
  port: 18090

spring:
  application:
    name: ecos-workspace-service
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    # 卷07 F07-01：这两条 Security 排除项与 aiming/datanet/buszhi/dccheng 四个独立 JAR
    # 完全一致 —— 鉴权不在这里做，由 common-api `ecos.security.header-auth`
    # 信任链拦截器承担（缺 X-ECOS-* → 403 ECOS-AUTH-010，fail-closed）。
    # 排除的只是 Boot 的"生成随机密码 + 全站 basic 登录页"默认链，
    # 不是认证本身；把它删掉而没有挂 SecurityFilterChain 会变成 401 全屏蔽。
    # 仅 dev profile（文末）允许整面关闭，默认 profile 强制鉴权。
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sys_man?currentSchema=ecos_control,ecos_data,ecos_ontology,ecos_ai,ecos_cognitive,ecos_knowledge,ecos_infra,ecos_dw,public&stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: WorkspaceHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  flyway:
    enabled: false

  # Neo4j (workspace 场景 KG 同步 Operation 需要) — PMO-49 Q2 补标准凭据避免 health DOWN
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}

  # Kafka (workspace 事件)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP:ecos-workspace}
      auto-offset-reset: earliest

  # MinIO (workspace PgObjectStorageService, 流程文件存储)
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: false

# PMO-49 D1: 收窄 MyBatis 类型别名扫包
ecos:
  event:
    kafka:
      # PMO-74 H2-T7 裁决 T-C 双投递：跨进程走 Kafka，同 JVM 仍本地分发，broker 缺席不丢本进程事件
      enabled: ${ECOS_EVENT_KAFKA_ENABLED:true}
  mybatis:
    type-aliases-package: com.chinacreator.gzcm.workspace
  # ── 卷07 F07-01 要点 3（R-24 已批准为 B 案）：两态鉴权等价 ──────────────────
  # 键名收口：原 `ecos.header-auth.enabled` 是死键（全仓 0 读取方，
  # HeaderAuthAutoConfiguration 只认 `ecos.security.header-auth`），
  # 因此 ":65-66 header-auth: false" 从未生效，等同常关（X-19 的实测根因）。
  # 现按 aiming/datanet/buszhi/dccheng 四个独立 JAR 的同一口径启用信任链：
  # ADR-7 端口隔离 ⇒ :18090 仅内网可达，身份由 gateway EcosTrustHeaderFilter 注入
  # X-ECOS-USER / X-ECOS-TENANT；缺头一律 403 ECOS-AUTH-010（fail-closed），
  # 消灭"匿名请求得 200"的裸奔面。默认 profile 强制 true，只有 dev 可关。
  security:
    header-auth:
      enabled: ${ECOS_WS_HEADER_AUTH:true}
  neo4j:
    enabled: ${ECOS_NEO4J_ENABLED:false}
  # ── 卷07 F07-17 底座收口：跨服务 base-url 两态寻址（ADR-15）──────────────────
  # 基址单真源 = route-manifest.json，经 runtime-access ServiceEndpointResolver 解析
  # （datanet 已切流 → :18082 直连；其余 owner 未切流 → monolith :8080 承流）。
  # 下列键仅为运维逃生口覆盖项，默认留空走解析链；本机绝对路径/端口、个人环境值禁止入库。
  # 超时口径集中在 workspace.config.WorkspaceRestClientConfig（键同下，默认值为代码缺省）。
  endpoints:
    # datanet: / buszhi: / dccheng: / aiming: / sysman: / gateway:  —— scheme://host:port 基址覆盖（无尾斜杠）
    # timeout: options-ms=3000 · probe-ms=1500 · cognitive-ms=30000（推理红线）· security-ms=5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.chinacreator.gzcm: INFO
    org.apache.kafka: WARN
    org.springframework: INFO
---
# 卷07 F07-01 要点 3：dev 是**唯一**允许免鉴权的 profile。
# 生产/默认 profile 不加载本段 ⇒ ecos.security.header-auth.enabled 恒为 true。
spring:
  config:
    activate:
      on-profile: dev
ecos:
  security:
    header-auth:
      # dev 直连 :18090（浏览器无 gateway 注入的 X-ECOS-* 信任头）时才允许关。
      # 启动期自检 `_win_tasks/test-workspace-auth-baseline.ps1` 会在此配置下跳过，
      # 在默认 profile 下必须断言"匿名请求 401/403，得 200 即 FAIL"。
      enabled: ${ECOS_INSECURE_DEV:false}
