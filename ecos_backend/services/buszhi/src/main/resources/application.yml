server:
  # PMO-49 P2-3: buszhi service 端口 18083 (与 ontology-engine 主引擎一致, 拆分期互斥运行)
  port: 18083

spring:
  application:
    name: ecos-buszhi-service
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sys_man?currentSchema=public&stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: BuszhiHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none

  # Neo4j — PMO-49 Q2: ont 域本体跨 causal 推理时 neo4j 可支持,
  # 骨架期服务先启动 health UP. 实际 neo4j 依赖 Phase 3 迁移后依需在
  # enterprise profile 激活
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j123}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: false

# PMO-49 D1: 收窄 MyBatis 类型别名扫包 — ontology 域 (金·I) + buszhi 域 (工作流)
# + ADR-7 X-ECOS-* 头校验 + Neo4j 开关
ecos:
  mybatis:
    type-aliases-package: com.chinacreator.gzcm.engine.ontology,com.chinacreator.gzcm.buszhi
  header-auth:
    enabled: false
  neo4j:
    enabled: ${ECOS_NEO4J_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.chinacreator.gzcm: INFO
    org.apache.kafka: WARN
    org.springframework: INFO
