server:
  port: 8081
  servlet:
    context-path: /sys-man

spring:
  application:
    name: sys-man-service
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# ECOS 版本标识: standard / enterprise / ultimate
ecos:
  edition: ${ECOS_EDITION:all}
  event:
    kafka:
      # PMO-74 H2-T7 裁决 T-C 双投递：跨进程走 Kafka，同 JVM 仍本地分发，broker 缺席不丢本进程事件
      enabled: ${ECOS_EVENT_KAFKA_ENABLED:true}

  datasource:
    url: ${ECOS_DB_URL:jdbc:postgresql://localhost:5432/sys_man?currentSchema=ecos_control,public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: SysManHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

# MyBatis Configuration
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: false

# Authentication Configuration
auth:
  enabled: true
  # PMO-74 H9-T5b: auth.whitelist.paths 已删除 —— 唯一消费方 api-gateway JwtAuthFilter 已归档至
  # archive/legacy/services-ghost（不在 reactor），本清单僵尸化且比 SecurityConfig 更宽。
  # 匿名端点的唯一事实源 = services/sysman/impl/sysman-impl 的 SecurityConfig permitAll（铁律 §1.2①）。

# LLM Configuration
llm:
  deepseek:
    api-key: ${DEEP...EY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
  engine:
    running: false
    default-provider: openrouter
    default-model: deepseek/deepseek-chat
    max-concurrency: 5
    default-timeout: 600
  gateway:
    retry-max-attempts: 3
    request-timeout: 60s
  profile:
    cache-enabled: false
    cache-ttl-minutes: 30
  level:
    root: INFO
    com.chinacreator.gzcm: DEBUG
    org.springframework: INFO

# JWT RS256 Keys — H1-T1/T2 (PMO-74): 私钥从环境变量注入（不入库），公钥为已轮换的新钥
