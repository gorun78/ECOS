  private-key: ${JWT_PRIVATE_KEY:}
  public-key: |
    -----BEGIN PUBLIC KEY-----
    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAvEI22S2DKpNWUkfxmxix
    zetUGcNX0Q41eHuBqt4zeUmv5rPvsP41AjkF6NffpyGsUrICWYDuhNcLa/R95zFN
    BH+4UKhQ1DbN8PZ6ongCHTIk9+u4SsvwrO4yzqt5pxIklc9h8P7hdsZk+gYYYGYb
    /wiAVpPIp3ZlBQhUXo63udUdfRN337eS3WvF93eO4axNJUCGXe6Wn6SBWjB1kSIk
    dG0Hp9x5kuUZM1G/v2CoOoQx0Az/IszAVGF9SCFwDnd6heyYLwquNkiUj+8NCIrC
