server:
  # PMO-49 P2-1: sysman service 端口 18081 (与 security-engine 主引擎一致, 拆分期互斥运行)
  port: 18081

spring:
  application:
    name: ecos-sysman-service
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sys_man?currentSchema=ecos_control,public&stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: SysmanHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  flyway:
    enabled: false

  # Neo4j (standard 档 standard 无 Neo4j, 但 classpath 有 driver 会自动探测)
  # PMO-49 Q2: 补凭据给 Neo4jReactiveHealthIndicator (避免 health DOWN 因 auth scheme none)
  # 本地 Docker neo4j 容器已起, password neo4j123
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: false

# PMO-49 D1: 收窄 MyBatis 类型别名扫包到 sysman 域
# + ADR-7 X-ECOS-* 头校验开关
# 避免 engine.security 同名 DataSecurityPolicy 别名冲突
ecos:
  mybatis:
    type-aliases-package: com.chinacreator.gzcm.sysman.security
  header-auth:
    enabled: false

# 认证配置 (PMO-74 H9-T5c 更正: gateway 侧 auth.whitelist 块已删除, "同款"前提不成立;
# 本 auth.enabled 全仓无存活 Java 消费方 —— H9-T5b 实测, 是否删除待 T5e 裁决)
auth:
  enabled: true

# PMO-49 ADR-8: 审计事件统一走 Kafka ecos.audit (sysman 端消费落库)
# Kafka 配置 (由 runtime-access 收敛 Client)
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  consumer:
    group-id: ${KAFKA_GROUP:ecos-sysman-audit}
    auto-offset-reset: earliest
  listener:
    ack-mode: batch

# JWT RS256 Keys — SEC-P0-2: 私钥环境变量注入, 公钥硬编码
