server:
  # PMO-49 P2-1: sysman service 端口 18081 (与 security-engine 主引擎一致, 拆分期互斥运行)
  port: 18081

spring:
  application:
    name: ecos-sysman-service
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sys_man?currentSchema=public&stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: SysmanHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: false

# PMO-49 D1: 收窄 MyBatis 类型别名扫包到 sysman 域
# + ADR-7 X-ECOS-* 头校验开关
# 避免 engine.security 同名 DataSecurityPolicy 别名冲突
ecos:
  mybatis:
    type-aliases-package: com.chinacreator.gzcm.sysman.security
  header-auth:
    enabled: false

# 认证配置 (与 gateway 同款: whitelist 已在 gateway, 本 service 侧 SecurityConfig 独立声明)
auth:
  enabled: true

# PMO-49 ADR-8: 审计事件统一走 Kafka ecos.audit (sysman 端消费落库)
# Kafka 配置 (由 runtime-access 收敛 Client)
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  consumer:
    group-id: ${KAFKA_GROUP:ecos-sysman-audit}
    auto-offset-reset: earliest
  listener:
    ack-mode: batch

# JWT RS256 Keys — SEC-P0-2: 私钥环境变量注入, 公钥硬编码
