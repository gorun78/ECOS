management:
  endpoints:
    web:
      exposure:
        include: health,beans,mappings
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.chinacreator.gzcm: INFO
    org.apache.kafka: WARN
    org.springframework: INFO
