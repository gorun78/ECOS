server:
  # PMO-49 P2-2: datanet service 端口 18082 (与 data-engine 主引擎一致, 拆分期互斥运行)
  port: 18082

spring:
  application:
    name: ecos-datanet-service
  main:
    # 与 gateway 双跑期允许 bean override (data-engine-impl 提供的 bean 与 runtime-core 版本共存)
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sys_man?currentSchema=public&stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: DatanetHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  flyway:
    # 铁律 §3.1: Flyway 已禁用, 不启用
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none

  # Neo4j — PMO-49 Q2: 补 spring.neo4j 标准凭据避免 Neo4jReactiveHealthIndicator DOWN (standard 档 Neo4j 非必需, 但 classpath driver 自动探测会做 health probe)
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j123}

# MyBatis Configuration
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: false

# PMO-49 D1: 收窄 MyBatis 类型别名扫包到 engine.data 域
# + ADR-7 X-ECOS-* 头校验开关
ecos:
  mybatis:
    type-aliases-package: com.chinacreator.gzcm.engine.data
  header-auth:
    enabled: false

# Management / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.chinacreator.gzcm: INFO
    org.apache.kafka: WARN
    org.springframework: INFO
