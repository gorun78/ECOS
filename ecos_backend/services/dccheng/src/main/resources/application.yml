server:
  # PMO-49 P2-4: dccheng service 端口 18086 (与 kb-engine 主引擎一致, 拆分期互斥运行)
  port: 18086

spring:
  application:
    name: ecos-dccheng-service
  main:
    # 双跑期允许 bean override (kb-impl 与 cognitive-impl 都提供同形 bean 时)
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sys_man?currentSchema=public&stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: DcchengHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  flyway:
    # 铁律 §3.1: Flyway 禁用
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none

  # Neo4j — PMO-49 Q2: dccheng 是 kb(cognitive 因果链>3 层启用 neo4j) 强依赖,
  # 显式补标准凭据让 Neo4jReactiveHealthIndicator 顶层 health UP
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j123}

# MyBatis
mybatis:
  # kb 引擎 mapper 全部位于 classpath*:mapper/*.xml (kb-impl 已用 src/main/resources 打包)
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: false

# PMO-49 D1: 收窄 MyBatis 类型别名扫包到 engine.kb + cognitive2 域
# + ADR-7 X-ECOS-* 头校验开关 + Neo4j (enterprise 档; runtime-access 收敛 Driver)
# 三档位: standard 不启用, enterprise 启用, ultimate 额外启用 Doris
ecos:
  mybatis:
    type-aliases-package: com.chinacreator.gzcm.engine
  header-auth:
    enabled: false
  neo4j:
    enabled: ${ECOS_NEO4J_ENABLED:false}
  # PMO-50 T1/T4: RAG 向量检索 + 本体事件消费者
  # RAG embedding 调用地址: 微服务走 ileng-service,.dccheng 同 JVM 自调 18086
  runtime-task:
    persistence:
      # PMO-72 W4: runtime-task PG 持久化开关 (架构铁律 §1.6 定时任务走 td_runtime_task_plan);
      # 启用后 JdbcTaskPersistenceService (@Primary) 替代 in-memory TaskPersistenceServiceImpl
      enabled: true
  rag:
    # B4: 须与 V137 的 embedding_vec 列维度一致，不一致时写入侧跳过并 log.warn
    embedding-model: ${ECOS_RAG_EMB_MODEL:text-embedding-3-small}
    llm-gateway-base: ${ECOS_RAG_LLM_BASE:}
    embedding-dimension: ${ECOS_RAG_EMB_DIM:1536}
  # 本体版本发布消费者: 微服务内网直连 buszhi 18083 (ADR-7 内网可达)
  ontology-base: ${ECOS_ONTOLOGY_BASE:http://localhost:18083/api/v1/ecos}
  # ⚠️ REST consumer of kb 的 OntologyTreeController / KbEntityInstanceExtractionService:
  # 默认走 gateway 同进程路由（fat-JAR 加载 OntologyController 直读 sys_man.public.ecos_ontology），
  # 避免 buszhi:18083 停服时本体树静默空（ADR-7 服务端口仅内网，buszhi 挂 = 403/连接拒绝 → 静默空树）。
  # body: gateway 的 /api/v1/ecos/** 在 auth.whitelist（见 gateway application.yml:80），匿名可达。
  ontology-api-base: ${ECOS_ONTOLOGY_API_BASE:http://localhost:8080/api/v1}
  # DCCheng 双跑期 (gateway 与 dccheng 共进程时) 自动识别:
  # 双跑时 event 走 Spring 同 JVM, REST 通过 X-ECOS- 头走 18083 也可
  dccheng:
    dually-hosted: ${ECOS_DUAL_HOSTED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.chinacreator.gzcm: INFO
    org.apache.kafka: WARN
    org.springframework: INFO
