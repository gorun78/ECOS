server:
  # PMO-49 P2-5: aiming service 端口 18084 (与 ai-engine 主引擎一致, 拆分期互斥运行)
  port: 18084

spring:
  application:
    name: ecos-aiming-service
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sys_man?currentSchema=ecos_control,ecos_data,ecos_ontology,ecos_ai,ecos_cognitive,ecos_knowledge,ecos_infra,ecos_dw,public&stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: AimingHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  flyway:
    enabled: false

  # Neo4j (agent mesh 因果/知识图谱) — PMO-49 Q2: 补标准凭据避免 health DOWN
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}

  # Kafka (agent 事件流 / 审计)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP:ecos-aiming}
      auto-offset-reset: earliest

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: false

# PMO-49 D1: 收窄 MyBatis 类型别名扫包到 ai 域
# + ADR-7 X-ECOS-* 头校验开关 + Neo4j (enterprise 档)
ecos:
  event:
    kafka:
      # PMO-74 H2-T7 裁决 T-C 双投递：跨进程走 Kafka，同 JVM 仍本地分发，broker 缺席不丢本进程事件
      enabled: ${ECOS_EVENT_KAFKA_ENABLED:true}
  mybatis:
    type-aliases-package: com.chinacreator.gzcm.engine.ai
  # F05-14/R-16 ①+③ 裁定：aiming service 态独立裁决。属性必须落
  # ecos.security.header-auth 前缀（common-api HeaderAuthAutoConfiguration 唯一认的键；
  # 旧条目曾误置 ecos.header-auth——auto-config 读不到，等同常关）。
  # 缺 X-ECOS-USER/X-ECOS-TENANT → 403 ECOS-AUTH-010（fail-closed 内网契约）。
  security:
    header-auth:
      enabled: true
  neo4j:
    enabled: ${ECOS_NEO4J_ENABLED:false}

# LLM 配置 (llm-gateway 收敛)
# F06-05：明文 api-key 配置面已删除 —— provider 密钥只由 llm-gateway 服务端经 security-engine
# 密钥服务按「引用」解析；引用为空即默认 DENY（不回退明文、不放行直连）。
llm:
  default-provider: ${LLM_PROVIDER:deepseek}
  gateway:
    default-api-key-ref: ${LLM_GATEWAY_DEFAULT_API_KEY_REF:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.chinacreator.gzcm: INFO
    org.apache.kafka: WARN
    org.springframework: INFO