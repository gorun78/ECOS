server:
  # PMO-49 P2-5: aiming service 端口 18084 (与 ai-engine 主引擎一致, 拆分期互斥运行)
  port: 18084

spring:
  application:
    name: ecos-aiming-service
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sys_man?currentSchema=public&stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: AimingHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none

  # Neo4j (agent mesh 因果/知识图谱) — PMO-49 Q2: 补标准凭据避免 health DOWN
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j123}

  # Kafka (agent 事件流 / 审计)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP:ecos-aiming}
      auto-offset-reset: earliest

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: false

# PMO-49 D1: 收窄 MyBatis 类型别名扫包到 ai 域
# + ADR-7 X-ECOS-* 头校验开关 + Neo4j (enterprise 档)
ecos:
  mybatis:
    type-aliases-package: com.chinacreator.gzcm.engine.ai
  header-auth:
    enabled: false
  neo4j:
    enabled: ${ECOS_NEO4J_ENABLED:false}

# LLM 配置 (llm-gateway 收敛)
llm:
  default-provider: ${LLM_PROVIDER:deepseek}
  api-key: ${LLM_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.chinacreator.gzcm: INFO
    org.apache.kafka: WARN
    org.springframework: INFO