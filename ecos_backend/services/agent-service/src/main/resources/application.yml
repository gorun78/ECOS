server:
  # 18086 归 services/dccheng（R-21 ① 消 18086 三连冲突）；本模块生产态随 aiming:18084 组装运行，此端口仅单调试用
  port: 18087

spring:
  application:
    name: agent-service
  datasource:
    url: jdbc:postgresql://localhost:5432/sys_man?currentSchema=ecos_agent
    username: postgres
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: agent-service
      auto-offset-reset: earliest
  flyway:
    enabled: false

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

neo4j:
  uri: bolt://localhost:7687
  authentication:
    username: neo4j
    password: ${NEO4J_PASSWORD:}