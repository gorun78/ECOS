server:
  port: 8080

spring:
  application:
    name: ecos-gateway
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/sys_man?currentSchema=public&stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: SysManHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  flyway:
    enabled: false

  # PMO-59 P2b: 认知心智层 Kafka 事件通道 (ecos.cognitive / ecos.audit)
  # 由 runtime-event EventBus 统一发送 (铁律 §2.5, 禁引擎自建 KafkaTemplate);
  # spring-kafka AutoConfiguration 依据本配置激活 producer 装配,
  # 类型化 KafkaTemplate<String,String> 由 CognitiveMentalConfig 补装配 (与 KafkaEventBusServiceImpl 同条件门)。
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
    consumer:
      group-id: ${KAFKA_GROUP:dccheng-cognitive-group}
      auto-offset-reset: earliest

# PMO-59 P2b: 认知心智层配置
# ① 事件总线上线 Kafka 路径 (runtime-event KafkaEventBusServiceImpl 激活; PMO-74 H2-T7 裁决 T-C 双投递，本地分发与 Kafka 并存):
#    强类型 Payload 经 EventBus 发 ecos.cognitive / ecos.audit; broker 不可达降级 WARN 不阻塞
# ② 心智层补算周期 (runtime-task MentalScanTask 周期, Duration 语义, 默认 10min)
ecos:
  event:
    kafka:
      # PMO-74 H2-T7 裁决 T-C 双投递：跨进程走 Kafka，同 JVM 仍本地分发，broker 缺席不丢本进程事件
      enabled: ${ECOS_EVENT_KAFKA_ENABLED:true}
  cognitive:
    scan-interval: 10m

# MyBatis Configuration
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: false

# 数据湖 MinIO 初始参数（近源库；enterprise/ultimate 档覆盖见 application-*.yml）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:ecos-datalake}

# Authentication Configuration
auth:
  enabled: true
  # PMO-74 H9-T5: auth.whitelist.paths 已删除 —— 唯一消费方 services/api-gateway/JwtAuthFilter
  # 不在 reactor（根 pom L430~438 卸载，无模块依赖该 artifact），本清单僵尸化且比 SecurityConfig 更宽。
  # 匿名端点的唯一事实源 = services/sysman/impl/sysman-impl 的 SecurityConfig permitAll（铁律 §1.2①）。

# Neo4j Configuration
neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: ${NEO4J_PASSWORD:}
  database: neo4j

# LLM Configuration
llm:
  default-provider: deepseek
  default-model: deepseek-chat
  default-temperature: 0.3
  max-context-tokens: 8000
  agent-timeout-ms: 300000
  deepseek:
    api-key: ${DEEP...EY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
  engine:
    running: false
    default-provider: openrouter
    default-model: deepseek/deepseek-chat
    max-concurrency: 5
    default-timeout: 600
  gateway:
    retry-max-attempts: 3
    request-timeout: 60s

# Agent Default Configuration (L1)
agent:
  default-max-iterations: 5
  default-system-prompt: "你是ECOS平台的AI助手。"

profile:
  cache-enabled: false
  cache-ttl-minutes: 30

logging:
  level:
    root: INFO
    com.chinacreator.gzcm: DEBUG
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,beans,mappings

