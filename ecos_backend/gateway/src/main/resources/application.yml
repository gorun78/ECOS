server:
  port: 8080

spring:
  application:
    name: ecos-gateway
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/sys_man?currentSchema=public&stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: SysManHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  flyway:
    enabled: false

# MyBatis Configuration
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: false

# Authentication Configuration
auth:
  enabled: true
  whitelist:
    paths:
      - "/api/health"
      - "/api/v1/auth/**"
      - "/error"
      - "/api/v1/ecos/**"
      - "/api/v1/security/health"          # 仅健康检查放行
      - "/api/v1/marketplace/**"
      - "/api/v1/agent/**"
      - "/api/v1/agent-loop/**"
      - "/api/v1/agent-call/**"
      - "/api/v1/agent-mesh/**"
      - "/api/v1/knowledge/**"
      - "/api/v1/glossary/**"
      - "/api/v1/catalog/**"
      - "/api/v1/oag/**"
      - "/api/v1/system/**"
      - "/api/v1/dict/**"
      - "/api/v1/ontology/**"
      - "/api/v1/task/**"
      - "/api/v1/lineage/**"
      - "/api/v1/mfa/**"
      - "/api/v1/privacy/**"
      - "/api/v1/world-model/**"
      - "/api/v1/agent-runtime/**"
      - "/api/v1/evolution/**"
      - "/api/v1/pipeline/**"
      - "/api/v1/dq/**"
      - "/api/v1/query/**"
      - "/api/v1/causal/**"
      - "/api/v1/monitor/**"
      - "/api/v1/twins/**"
      - "/api/v1/pareto/**"
      - "/api/v1/portal/**"
      - "/api/v1/integration/**"
      - "/api/v1/cognitive/**"
      - "/api/v1/engine/**"
      - "/api/v1/workspace/**"
      - "/api/v1/guardrails/**"
      - "/api/v1/aip/**"
      - "/api/v1/agents/**"
      - "/api/v1/cron-jobs/**"
      - "/api/v1/skills/**"
      - "/api/alerts/**"
      - "/api/datalake/**"
      - "/api/workbook/**"
      - "/api/agent/tools/**"
      - "/datanet/**"
      - "/cases/**"

# Neo4j Configuration
neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: neo4j123
  database: neo4j

# LLM Configuration
llm:
  default-provider: deepseek
  default-model: deepseek-chat
  default-temperature: 0.3
  max-context-tokens: 8000
  agent-timeout-ms: 300000
  deepseek:
    api-key: ${DEEP...EY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
  engine:
    running: false
    default-provider: openrouter
    default-model: deepseek/deepseek-chat
    max-concurrency: 5
    default-timeout: 600
  gateway:
    retry-max-attempts: 3
    request-timeout: 60s

# Agent Default Configuration (L1)
agent:
  default-max-iterations: 5
  default-system-prompt: "你是ECOS平台的AI助手。"

profile:
  cache-enabled: false
  cache-ttl-minutes: 30

logging:
  level:
    root: INFO
    com.chinacreator.gzcm: DEBUG
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,beans,mappings

