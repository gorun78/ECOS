# ── ECOS 标准版 (Standard Edition) ──
# 适用: 单一组织、<50GB数据、PG Only
# 启动: SPRING_PROFILES_ACTIVE=standard

ecos:
  edition: standard
  graph:
    provider: pg
  analytics:
    provider: pg
  storage:
    provider: pg
  features:
    knowledge-graph: false
    causal-analysis: false
    workbook-sandbox: false
    nsga-ii-optimizer: false
    multi-tenant: false
    opentelemetry: false
  module:
    aimod: false
    cognitive: false
    worldmodel: false
    market: false
    portal: false
  oag:
    # OAG 推理节点 LLM 模型 fallback 链（按优先级排列，第一项最先尝试）
    # 2026-11-24：改 env 占位（同 llm.* 对齐口径，详见 application.yml LLM 段注释）。
    # 内网网关无 deepseek-chat/qwen-turbo，部署时用 ECOS_OAG_MODEL_FALLBACK 盖成本网实际模型链。
    model-fallback: ${ECOS_OAG_MODEL_FALLBACK:deepseek-chat,qwen-turbo}
