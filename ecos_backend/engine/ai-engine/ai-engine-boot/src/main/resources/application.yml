server:
  # boot 调试态端口 = 服务端口 +1000（与 _win_tasks/start-backend.ps1 同口径；R-21 ①）：18084 归 services/aiming
  port: 19084

spring:
  application:
    name: ecos-ai-engine-boot
  datasource:
    url: jdbc:postgresql://localhost:5432/sys_man
    username: postgres
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.chinacreator.gzcm.cognitive.model

logging:
  level:
    com.chinacreator.gzcm: DEBUG
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
