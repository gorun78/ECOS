server:
  port: 18082

spring:
  application:
    name: ecos-data-engine-boot
  datasource:
    url: jdbc:postgresql://localhost:5432/sys_man
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.chinacreator.gzcm.datanet.model

# 数据湖 MinIO 初始参数（近源库，boot 独立调试用；生产走 gateway/application.yml）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:ecos-datalake}

logging:
  level:
    com.chinacreator.gzcm: DEBUG
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
