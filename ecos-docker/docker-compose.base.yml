version: '3.8'

# =============================================================================
# ECOS Base Compose — 所有版本共用
#   - PostgreSQL 16 (sys_man, root/root)
#   - ECOS Gateway (port 8080, build from project root)
#
# 使用方式:
#   标准版: docker compose -f docker-compose.base.yml -f docker-compose.standard.yml up -d
#   企业版: docker compose -f docker-compose.base.yml -f docker-compose.enterprise.yml up -d
#   旗舰版: docker compose -f docker-compose.base.yml -f docker-compose.ultimate.yml up -d
# =============================================================================

services:
  postgres:
    image: postgres:16
    container_name: ecos-postgres
    environment:
      POSTGRES_DB: sys_man
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - ./init-pg:/docker-entrypoint-initdb.d
      - pg-data:/var/lib/postgresql/data
      # pgvector 0.8.1 扩展持久化：官方 postgres 镜像未内置 vector，容器删除重建后会丢失
      # 扩展导致 V137__knowledge_embedding_vector_column.sql 的 CREATE EXTENSION 失败。
      # 此处以文件级挂载固化 vector.so / 控制文件 / 基础 SQL；文件由 Alpine v3.20 的
      # postgresql-pgvector-0.6.2 包解出（Docker Hub 不可达时的离线替代，版本 0.8.1）。
      - ./postgres-extensions/vector.so:/usr/local/lib/postgresql/vector.so:ro
      - ./postgres-extensions/vector.control:/usr/share/postgresql/extension/vector.control:ro
      - ./postgres-extensions/vector--0.8.1.sql:/usr/share/postgresql/extension/vector--0.8.1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d sys_man"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ecos-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        EDITION: ${ECOS_EDITION:-standard}
    container_name: ecos-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${ECOS_EDITION:-standard}
      ECOS_EDITION: ${ECOS_EDITION:-standard}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sys_man
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
    driver: local
