# ECOS Infrastructure Docker Compose
# 现行职责：仅基础设施（PG 16 / Zookeeper / Kafka / Neo4j 5 / MinIO / OPA）+ Grafana。
# 微服务 v2（7 JAR）在 Windows 本机经 _win_tasks/start-backend.ps1 启动，不走容器；
# v1 legacy 应用容器见 docker-compose.app-v1-legacy.yml（2026-09-28 D 组拆离）。

services:
  # ===== Infrastructure =====
  postgres:
    image: postgres:16-alpine
    container_name: ecos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sys_man
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
      # pgvector 0.8.1 扩展持久化：镜像 postgres:16-alpine 未内置 vector，容器删除重建后
      # 会丢失扩展导致 V137__knowledge_embedding_vector_column.sql 的 CREATE EXTENSION 失败。
      # 此处以文件级挂载固化 vector.so / 控制文件 / 基础 SQL；文件由 Alpine v3.20 的
      # postgresql-pgvector-0.6.2 包解出（Docker Hub 不可达时的离线替代，版本 0.8.1）。
      - ./postgres-extensions/vector.so:/usr/local/lib/postgresql/vector.so:ro
      - ./postgres-extensions/vector.control:/usr/share/postgresql/extension/vector.control:ro
      # 基础 SQL 2026-10-05 归入 canonical 数据脚本 (L3, 详见 docs/50-db_script/数据层规范化治理落地指令-2026-10-05.md)
      - ../docs/50-db_script/sql/runtime-access/vector--0.8.1.sql:/usr/share/postgresql/extension/vector--0.8.1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ecos-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    mem_limit: 256m

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ecos-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    mem_limit: 512m

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ecos-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Creating Kafka topics..."
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.identity --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.catalog --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.ontology --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.ontology.published --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.object --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.workflow --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.agent --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.knowledge --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.cognitive --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.audit --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.data.security-tagged --partitions 3 --replication-factor 1
        echo "Kafka topics created successfully."
    mem_limit: 128m

  neo4j:
    image: neo4j:5.26-community
    container_name: ecos-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    mem_limit: 768m

  minio:
    image: minio/minio:latest
    container_name: ecos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  opa:
    image: openpolicyagent/opa:0.63.0
    container_name: ecos-opa
    restart: unless-stopped
    command: run --server --log-level=info --addr=:8181
    ports:
      - "8181:8181"
    volumes:
      - ./opa-policies:/policies:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8181/v1/data || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 64m

  # ===== v1 legacy app containers =====
  # api-gateway + 9 个 ecos/*:latest v1 服务已拆离至 docker-compose.app-v1-legacy.yml
  # （2026-09-28 整理方案 D 组）。现行部署为微服务 v2：Windows 本机 _win_tasks/ 启 7 个 JAR，
  # 本 compose 仅承载基础设施（PG/ZK/Kafka/Neo4j/MinIO/OPA）+ Grafana。
  grafana:
    image: grafana/grafana:11.0.0
    container_name: ecos-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ecos2026
      GF_DATASOURCES_DEFAULT_0_TYPE: postgres
      GF_DATASOURCES_DEFAULT_0_URL: postgres:5432
      GF_DATASOURCES_DEFAULT_0_USER: postgres
      GF_DATASOURCES_DEFAULT_0_PASSWORD: postgres
      GF_DATASOURCES_DEFAULT_0_DATABASE: sys_man
    volumes:
      - grafanadata:/var/lib/grafana
    mem_limit: 512m

volumes:
  pgdata:
    name: ecos_pgdata
  kafkadata:
    name: ecos_kafkadata
  neo4jdata:
    name: ecos_neo4jdata
  neo4jlogs:
    name: ecos_neo4jlogs
  miniodata:
    name: ecos_miniodata
  grafanadata:
    name: ecos_grafanadata
