# ECOS Infrastructure Docker Compose
# 现行职责：仅基础设施（PG 16 / Zookeeper / Kafka / Neo4j 5 / MinIO / OPA）+ Grafana。
# 微服务 v2（7 JAR）在 Windows 本机经 _win_tasks/start-backend.ps1 启动，不走容器；
# v1 legacy 应用容器见 docker-compose.app-v1-legacy.yml（2026-09-28 D 组拆离）。

services:
  # ===== Infrastructure =====
  postgres:
    # 2026-11-10 起改用官方 pgvector 镜像：原 postgres:16-alpine + 手工挂载 vector.so 的方案
    # 有版本错配缺陷（挂的 .so 是 0.6.2 编译产物，而基础 SQL 声明 0.8.1，CREATE EXTENSION 报
    # "could not find function l2_normalize"）。pg16 变体自带匹配的 0.8.x 扩展，无需任何挂载。
    image: pgvector/pgvector:pg16
    container_name: ecos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sys_man
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ecos-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    mem_limit: 256m

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ecos-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 60s
    mem_limit: 512m

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ecos-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Creating Kafka topics..."
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.identity --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.catalog --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.ontology --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.object --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.workflow --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.agent --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.knowledge --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.audit --partitions 3 --replication-factor 1
        # 详细设计-00 C.5.3 (W12)：补齐代码已有而 compose 缺失的 3 条 topic，
        # 与 runtime KafkaTopics 常量对齐，供 KafkaTopicParityTest 断言。
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.data.security-tagged --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.ontology.published --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ecos.cognitive --partitions 3 --replication-factor 1
        echo "Kafka topics created successfully."
    mem_limit: 128m

  neo4j:
    image: neo4j:5.26-community
    container_name: ecos-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 768m

  minio:
    image: minio/minio:latest
    container_name: ecos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  opa:
    image: openpolicyagent/opa:0.63.0
    container_name: ecos-opa
    restart: unless-stopped
    # 2026-10-16: 必须带 -b /policies 才会加载下行 volume 里的策略源。
    # 缺省时服务起来但零策略（GET /v1/policies = {"result":[]}），裁决恒落
    # POLICY_UNDEFINED → fail-closed，与"策略真的拒绝"不可分辨（default allow=false 语义未变）。
    command: run --server --log-level=info --addr=:8181 -b /policies
    ports:
      - "8181:8181"
    volumes:
      - ./opa-policies:/policies:ro
    healthcheck:
      test: ["CMD", "opa", "eval", "--fail", "true"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 64m

  # ===== v1 legacy app containers =====
  # api-gateway + 9 个 ecos/*:latest v1 服务已拆离至 docker-compose.app-v1-legacy.yml
  # （2026-09-28 整理方案 D 组）。现行部署为微服务 v2：Windows 本机 _win_tasks/ 启 7 个 JAR，
  # 本 compose 仅承载基础设施（PG/ZK/Kafka/Neo4j/MinIO/OPA）+ Grafana。
  grafana:
    image: grafana/grafana:11.0.0
    container_name: ecos-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ecos2026
      GF_DATASOURCES_DEFAULT_0_TYPE: postgres
      GF_DATASOURCES_DEFAULT_0_URL: postgres:5432
      GF_DATASOURCES_DEFAULT_0_USER: postgres
      GF_DATASOURCES_DEFAULT_0_PASSWORD: postgres
      GF_DATASOURCES_DEFAULT_0_DATABASE: sys_man
    volumes:
      - grafanadata:/var/lib/grafana
    mem_limit: 512m

  # ── #147G-Redis（R7~R11 补充设计册 §2.9.8 ⑤/⑧ 裁决；2026-11-03 用户授权「本轮不受禁新容器限制」）──
  # 定位：runtime 缓存的**远程共享层**（跨节点失效的前提）；无密码仅限内网/本机开发，
  # 生产须启用 AUTH + TLS + 受控网络（§2.9.8 ⑥）。持久化用 AOF（缓存可重建，掉电不需强一致）。
  ecos-redis:
    image: redis:7-alpine
    container_name: ecos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 320m

volumes:
  pgdata:
    name: ecos_pgdata
  kafkadata:
    name: ecos_kafkadata
  neo4jdata:
    name: ecos_neo4jdata
  neo4jlogs:
    name: ecos_neo4jlogs
  miniodata:
    name: ecos_miniodata
  grafanadata:
    name: ecos_grafanadata
  redisdata:
    name: ecos_redisdata
