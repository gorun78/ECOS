# ECOS v1 legacy app containers (拆离自 docker-compose.yml，2026-09-28 整理方案 D 组)
# 来源: 原主 compose "# ===== Microservices =====" 段（api-gateway + 9 个 ecos/*:latest v1 服务，
#       行 152-349）。该拓扑属微服务 v1 拆分时代，与现行 v2 七 JAR 架构（gateway:8080 +
#       sysman/datanet/buszhi/dccheng/aiming/workspace）不一致，默认不启用。
# 用法: 如需恢复 v1 容器，叠加运行（v1 服务通过服务名依赖 postgres/kafka/neo4j，须与主文件同用）：
#   docker compose -f docker-compose.yml -f docker-compose.app-v1-legacy.yml up -d
# 注意: 本文件不得与 Windows 本机 v2 jar 进程同跑（8080/18081-18089 端口冲突）。

services:
  api-gateway:
    image: ecos/api-gateway:latest
    container_name: ecos-api-gateway
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sys_man?currentSchema=ecos_identity
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    mem_limit: 512m

  identity-service:
    image: ecos/identity-service:latest
    container_name: ecos-identity-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "18081:18081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sys_man?currentSchema=ecos_identity
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPA_BASE_URL: http://opa:8181
    mem_limit: 512m

  catalog-service:
