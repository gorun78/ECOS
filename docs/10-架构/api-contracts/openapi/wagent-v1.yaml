# =====================================================================
# wagent-v1.yaml — W Agent 编排面（wagent v1）机器可读 REST/SSE 契约
# ---------------------------------------------------------------------
# 溯源：《详细设计-10-W Agent编排与DIK-C赋能》§五（W245~W277 ↔ C227~C259）。
#   · 路径/operationId 单源 = ecos_backend/engine/ai-engine/ai-engine-impl/
#     src/main/java/com/chinacreator/gzcm/engine/ai/wagent/WAgentApiPaths.java
#     （本文件与其同源，参数名字面量取 P_* 常量口径；§5.2 表 24 端点 / 25 operationId
#     全量覆盖，另附 §5.2 表外能力探测端点 getRunProgressCapability）。
#   · 错误码单源 = WAgentErrorCodes.java（§5.3 十一码 + 实测第 12 枚举
#     ECOS_WA_CALIBER_LOCKED，409，reviseGoal 口径锁专用）。
#   · 响应包裹 = runtime/common-api ApiResponse.java 实测字段
#     {code:int, errorCode:String, message, data, timestamp:Long, traceId:String}。
#     注意：卷10 §5.3 脚注"traceId 字段实测不存在（卷06 C135 待补）"已被现源
#     码超越——ApiResponse.java:60 在位 traceId 字段并有 withTraceId()（:99），
#     C135 已补齐，本契约按实测登记。
# ---------------------------------------------------------------------
# 工件属性（诚实声明，W277/P-5）：
#   1. 本文件是 wagent 面**首个手工登记的机器可读契约**（R2-C/#133 交付），
#      **不是 springdoc 生成物**——springdoc 挂载未实测，禁写"已生成"。
#   2. x-implementation-status: implemented = Controller 逐行实测（行号见各端点）；
#      partial = 端点在位但按设计依赖降级（如 SSE 经 P-4）；
#      planned = 仅 WAgentApiPaths 路径常量在位，Controller 未落地
#      （#11~#16 归 R2-B、#17~#24 归 R3-A 批次）。
#   3. 契约 ↔ Controller 字段级一致性门禁归 P-5 后续，本文件 DTO 仅到
#      信封级（ApiResponse）+ 设计级 data 占位（additionalProperties: true），
#      禁据此生成客户端假象。
#   4. 安全口径：wagent 全部端点要求 JWT 认证；禁进入
#      AnonymousEndpointRegistry.permitAllPatterns() 匿名面（WAgentApiPaths 头注）。
#   5. 前缀策略（§5.1，只增不改）：正典 /api/v1/wagent；双路径 /api/wagent 经
#      VersionPrefixRewriteFilter REVERSE 映射收敛到 v1，Controller 禁直接映射裸前缀。
#      不复用已混乱的 /api/v1/agent 族（X-2/W252/R-43）。
# ---------------------------------------------------------------------
# 【2026-10-12 全量设计复盘回写】v1.0.0 → v1.0.1：
#   ① servers 的 ai-engine 直连端口按实测订正（18085 系 v1 legacy 幽灵端口，见 servers 注记）；
#   ② planned 面 readiness/evidence/candidates 三处端点定义对齐前端消费签名
#      （ReadinessCard.tsx:2 / EvidenceDrawer.tsx:4 / CandidateDiffView.tsx:6，均为组件头注声明的
#      消费路径；WAgentApiPaths 常量现态与前端签名的收敛属 R2-B/R3-A 批次事项，
#      各端点 x-correction-2026-10-12 已逐条登记差异）；implemented 面不动。
# =====================================================================
openapi: 3.0.3
info:
  title: ECOS W Agent 编排面 API（wagent v1）
  version: 1.0.1   # 2026-10-12 复盘回写：servers 端口订正（18085→18084/19084 实测）+ planned 面
                   # readiness/evidence/candidates-review 签名对齐前端消费位点（见各端点 x-correction-2026-10-12）
  description: |
    W Agent 编排与 DIK-C 赋能对外契约（详细设计-10 §5.2 首批 24 端点 / 25 operationId，REST + SSE）。
    错误语义见 §5.3 十一错误码（components.responses 按 wire code 登记）；
    错误码经 `ApiResponse.errorCode` 字段区分，同一 HTTP 状态可承载多个 E- 码。
    进度通道：SSE（#7）依赖 P-4，当前实测恒为如实 502 `E-WA-DEP` + 轮询回落
    （WAgentRunController:111~125，禁伪流、禁 200 空挂）；能力探测见
    `getRunProgressCapability`（§5.2 表外，F10-16）。
  contact:
    name: ECOS 卷10 R2-C（W277/P-5）
  license:
    name: Proprietary
servers:
  # 双路径口径（§5.1）：网关侧 /api/v1/wagent/** 与 /api/wagent/** 各登记一遍，
  # 后者经 VersionPrefixRewriteFilter REVERSE 收敛到 v1 正典。
  # 路径本体一律挂正典前缀（§5.2 表基准）；legacy 形态仅入口等价，不另列 paths。
  - url: http://localhost:8080
    description: 网关聚合入口（gateway:8080；正典前缀 /api/v1/wagent，legacy 双路径 /api/wagent 等价）
  - url: http://localhost:18084
    description: |
      2026-10-12 复盘订正：原登记 18085 与代码不符——18085 仅存在于 v1 legacy 幽灵工程
      （ecos_backend/archive/legacy/services-ghost/api-gateway）与 docker-compose.app-v1-legacy.yml，
      现网 ai-engine 面无此端口。实测属主部署面 = services/aiming :18084
      （services/aiming/src/main/resources/application.yml:3 `port: 18084`）；
      ai-engine-boot 调试态 = 19084（engine/ai-engine/ai-engine-boot/src/main/resources/application.yml:2-3，
      boot 端口 = 服务端口 +1000 口径）。平台 API 基线仍以 gateway :8080 承流为准入面，
      本直连面仅内部调试（R2-C 注记）。
tags:
  - name: goals
    description: §5.2 #1~#2 Goal 生命周期（口径变更⇒新版本；被引用则 409 ECOS_WA_CALIBER_LOCKED）
  - name: questions
    description: §5.2 #3~#4 Question（意图识别 + 澄清返回 CLARIFY，F10-06/07）
  - name: runs
    description: §5.2 #5~#10 Run 编排（状态机/幂等/预算/awaiting_input/awaiting_approval/cancel）
  - name: flags
    description: §5.2 #11 Kill Switch（租户/系统级；仅 admin 角色 + 审计，F10-21）
  - name: readiness
    description: §5.2 #12~#13 Readiness（等级+缺项+缺口；补齐循环 ≤3，F10-08/09）
  - name: tools
    description: §5.2 #14~#16 工具契约（渐进披露 F10-18；契约测试五关 F10-17；只 active 可召回）
  - name: candidates
    description: §5.2 #17~#20 Candidate 写通道（四眼评审；publish 需 approval_token + pre-commit 裁决 + Git 归档，F10-21/23）
  - name: evidence
    description: §5.2 #21~#22 Claim/Evidence 追溯链（F10-24）
  - name: decisions
    description: §5.2 #23 决策留档（引用 pinned 评估记录）
  - name: actions
    description: §5.2 #24 行动草稿/提交（属主 ai-engine，经属主 Engine 写端点，Agent 不写对方表，REQ-WAG-02/R-32①）

security:
  - bearerAuth: []

paths:
  /api/v1/wagent/approval-tokens:
    post:
      tags: [approval]
      operationId: createApprovalToken
      summary: L3 审批凭证签发（一次性 + 四眼；CLI --approval-token 的来源）
      x-implementation-status: implemented   # WAgentApprovalController#createApprovalToken（V326 数据面）
      x-design-ref: "详细设计-10 §5.2 #20/#24b 的 L3 凭证闸（批 D 闭环）；ecos_ai.agent_approval V326 补列"
      description: |
        签发一次性审批凭证：绑定 {@code scopeType + scopeId}，默认 30 分钟有效（上限 8 小时）。
        服务端只存 SHA-256 摘要，**明文仅在本次响应出现一次**。
        两道闸：① 仅 admin 角色可签发（fail-closed 403）；② 四眼——审批人（当前主体）
        不得为 {@code requestedBy} 自己签发。
        消费语义：凭证在 L3 动作真正执行时一次性消费（CAS），重放必拒（409 E-WA-STATE）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopeType, scopeId]
              properties:
                scopeType:
                  type: string
                  enum: [CANDIDATE_PUBLISH, ACTION_COMMIT, RUN_APPROVAL, PIPELINE_PUBLISH]
                  description: 凭证作用域类型（L3ApprovalScope 单源）
                scopeId:
                  type: string
                  maxLength: 64
                  description: 作用域对象 ID（candidateId / actionId / runId），凭证不得跨对象复用
                requestedBy:
                  type: string
                  maxLength: 100
                  description: 发起该 L3 动作的人；等于审批人即 403（四眼）
                ttlSeconds:
                  type: integer
                  minimum: 1
                  maximum: 28800
                  description: 有效期（缺省 1800s，上限 28800s）
      responses:
        "200":
          description: 签发成功（data.approvalId / data.token（仅此一次）/ scopeType / scopeId / expiredAt）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "400": { $ref: "#/components/responses/E-VALIDATION" }
        "401": { $ref: "#/components/responses/E-AUTH" }
        "403": { $ref: "#/components/responses/E-POLICY" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        wagent 面统一 JWT 认证（WAgentApiPaths 头注：禁进入
        AnonymousEndpointRegistry.permitAllPatterns() 匿名面）；
        权限/裁决经 security-engine（ST04/ST05），不可用即默认 DENY（§5.4 GUARDRAIL_FAIL_CLOSED）。

  parameters:
    GoalId:
      name: goalId
      in: path
      required: true
      description: 单源参数名 = WAgentApiPaths.P_GOAL_ID
      schema: { type: string, maxLength: 36 }
    QuestionId:
      name: questionId
      in: path
      required: true
      description: 单源参数名 = WAgentApiPaths.P_QUESTION_ID
      schema: { type: string, maxLength: 36 }
    RunId:
      name: runId
      in: path
      required: true
      description: 单源参数名 = WAgentApiPaths.P_RUN_ID
      schema: { type: string, maxLength: 36 }
    ToolName:
      name: name
      in: path
      required: true
      description: 单源参数名 = WAgentApiPaths.P_NAME（工具名，V266 name 列语义）
      schema: { type: string, maxLength: 100 }
    CandidateId:
      name: candidateId
      in: path
      required: true
      description: 单源参数名 = WAgentApiPaths.P_CANDIDATE_ID
      schema: { type: string, maxLength: 36 }
    ActionId:
      name: actionId
      in: path
      required: true
      description: 单源参数名 = WAgentApiPaths.P_ACTION_ID
      schema: { type: string, maxLength: 36 }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      description: 单源参数名 = WAgentApiPaths.P_EVIDENCE_ID
      schema: { type: string, maxLength: 36 }
    Prefer:
      name: Prefer
      in: header
      required: false
      description: "respond-async：异步受理（startRun 202 + run_id；submitRunInput 同步通道内推进）"
      schema:
        type: string
        example: respond-async
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 幂等键（§5.2 #1 可选/#5 幂等冲突回既有 run_id，E-IDEMPOTENT-CONFLICT）
      schema: { type: string, maxLength: 100 }

  responses:
    # ── §5.3 十一错误码（wire code = WAgentErrorCodes 枚举字面量，components 键名同码）──
    E-VALIDATION:
      description: "E-VALIDATION（400）入参/Schema 校验失败；不可重试；文案指出具体字段"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 400, errorCode: "E-VALIDATION", message: "字段 goal.title 缺失 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-AUTH:
      description: "E-AUTH（401）未认证；引导重新登录；security-engine 不可用亦收敛于此码 + GUARDRAIL_FAIL_CLOSED 审计"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 401, errorCode: "E-AUTH", message: "凭证无效或已过期 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-POLICY:
      description: "E-POLICY（403）裁决拒绝（含 Kill Switch）；可读拒绝理由 + 负责人建议；不泄露对象存在性"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 403, errorCode: "E-POLICY", message: "策略拒绝：写通道需人工审批 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-NOT-FOUND:
      description: "E-NOT-FOUND（404）对象不可见；文案与 403 不可区分（防枚举）"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 404, errorCode: "E-NOT-FOUND", message: "资源不存在或不可见 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-WA-STATE:
      description: "E-WA-STATE（409）状态机冲突 / 口径锁定 / 候选过期；提示当前状态与允许操作"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 409, errorCode: "E-WA-STATE", message: "Run 当前态 awaiting_input 不允许该操作 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-IDEMPOTENT-CONFLICT:
      description: "E-IDEMPOTENT-CONFLICT（409）幂等键冲突；返回既有 run_id"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 409, errorCode: "E-IDEMPOTENT-CONFLICT", message: "幂等键已存在，返回既有 run [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-RATE:
      description: "E-RATE（429）配额/预算超限；可退避重试（委托 LLM_RATE_LIMITED 指数退避 ≤3）；提示剩余额度与降级选项"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 429, errorCode: "E-RATE", message: "租户配额耗尽，请退避后重试 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-WA-BUDGET:
      description: "E-WA-BUDGET（429）Run 预算耗尽；不可重试；提示拆分问题"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 429, errorCode: "E-WA-BUDGET", message: "本次 Run 预算已耗尽，建议拆分问题 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-WA-DEP:
      description: "E-WA-DEP（502/503）Engine/底座依赖不可用；可重试 + 降级标注（实测枚举 httpStatus=502，503 为设计并列形态，§5.3）"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 502, errorCode: "E-WA-DEP", message: "SSE 进度通道(P-4/F10-16)不可用，请轮询 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-WA-NARRATIVE-NUM:
      description: "E-WA-NARRATIVE-NUM（500）数字一致性校验失败（abs 差/max ≤ 1e-4 之外）；重生成 ≤2 次；阻断发布 + 标注"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 500, errorCode: "E-WA-NARRATIVE-NUM", message: "叙述数字与计算值不一致，已阻断发布 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-INTERNAL:
      description: "E-INTERNAL（500）未分类内部错误；含 trace_id；禁回显堆栈（对卷 07 C159\"异常原文入体\"的同类预防）"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 500, errorCode: "E-INTERNAL", message: "内部错误 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    ECOS_WA_CALIBER_LOCKED:
      description: |
        （§5.3 表外第 12 枚举，WAgentErrorCodes.java:78 实测在位）
        ECOS_WA_CALIBER_LOCKED（409）Goal 口径被引用锁定，reviseGoal 专用（§5.2 #2 注记）。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 409, errorCode: "ECOS_WA_CALIBER_LOCKED", message: "口径已被既有 Goal 引用，请走新版本 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }

  schemas:
    ApiResponse:
      type: object
      description: |
        统一响应包裹（runtime/common-api ApiResponse.java 实测六字段：
        code/errorCode/message/data/timestamp/traceId）。
        卷10 §5.3 记"code/message/data/traceId"为设计口径；
        "traceId 实测不存在（卷06 C135 待补）"的脚注已被源码现状超越
        （ApiResponse.java:60 traceId 在位、:99 withTraceId()），本契约按实测登记。
        错误码语义承载于 errorCode（见 components.responses）。
      required: [code, message]
      properties:
        code:
          type: integer
          description: 与 HTTP 状态一致的业务码（成功 200 族）
          example: 200
        errorCode:
          type: string
          nullable: true
          description: E-* / ECOS_WA_* wire code；成功为 null
          enum:
            - E-VALIDATION
            - E-AUTH
            - E-POLICY
            - E-NOT-FOUND
            - E-WA-STATE
            - E-IDEMPOTENT-CONFLICT
            - E-RATE
            - E-WA-BUDGET
            - E-WA-DEP
            - E-WA-NARRATIVE-NUM
            - E-INTERNAL
            - ECOS_WA_CALIBER_LOCKED
        message:
          type: string
          description: 用户可读文案；错误模板必含 {traceId} 诊断码（WAgentErrorCodes 构造校验:89~90）
        data:
          nullable: true
          description: 业务载荷（各端点 data 设计级占位，字段收敛随 P-5 门禁）
        timestamp:
          type: integer
          format: int64
          nullable: true
        traceId:
          type: string
          nullable: true
          description: 全链诊断码（AiTraceSupport/ MDC；成功响应亦携带）

    # ── 以下 data/请求体 DTO 为设计级占位（additionalProperties: true）：
    #    字段级契约以 Controller DTO 实测收敛为 P-5 门禁事项，本文件不虚构字段清单 ──
    GoalCreateRequest:
      type: object
      description: 创建 Goal 请求（§5.2 #1；设计级占位，字段随 P-5 收敛）
      additionalProperties: true
    GoalReviseRequest:
      type: object
      description: 修订 Goal 请求（§5.2 #2；口径变更⇒新版本）
      additionalProperties: true
    Goal:
      type: object
      description: Goal 对象（WAgentGoalController 视图；字段清单随 P-5 收敛）
      additionalProperties: true
    QuestionCreateRequest:
      type: object
      description: 创建 Question 请求（§5.2 #3；含原始表述与槽位提示）
      additionalProperties: true
    Question:
      type: object
      description: Question 对象（含 disposition RESOLVED|CLARIFY 与 latest_run 摘要）
      additionalProperties: true
    RunStartRequest:
      type: object
      description: 启动 Run 请求（§5.2 #5；question 引用 + 预算/自动化上界）
      additionalProperties: true
    RunInputRequest:
      type: object
      description: awaiting_input 应答体（§5.2 #8；WAgentRunController RunInputRequest.input 实测形态）
      additionalProperties: true
    RunApprovalRequest:
      type: object
      description: 人工门审批凭证（§5.2 #9；approve/deny + 凭证校验）
      additionalProperties: true
    Run:
      type: object
      description: Run 快照（状态机态 + timeline；态集合=Run 六态，§4 状态机）
      additionalProperties: true
    KillSwitchRequest:
      type: object
      description: Kill Switch 设置（§5.2 #11；范围=租户/系统级，仅 admin）
      additionalProperties: true
    CandidateReviewRequest:
      type: object
      description: 四眼评审（§5.2 #19；通过/驳回 + 理由；禁批量语义在服务端强制）
      additionalProperties: true
    CandidatePublishRequest:
      type: object
      description: 发布请求（§5.2 #20；approval_token **必填**，缺失即 E-VALIDATION）
      required: [approval_token]
      properties:
        approval_token:
          type: string
          description: 人工审批凭证（F10-21 L3 无自动路径；F10-23 pre-commit 裁决前置）
      additionalProperties: true
    DecisionRecordRequest:
      type: object
      description: 决策留档（§5.2 #23；引用 pinned 评估记录 + baseline 槽位）
      additionalProperties: true
    ActionDraftRequest:
      type: object
      description: 行动草稿（§5.2 #24a；side_effect=draft，不落生产）
      additionalProperties: true
