<!DOCTYPE html>
<html lang="zh-CN" data-theme="slate-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECOS 前端可交互原型 v2.0 · 产品结构对齐版</title>
<style>
/* ========== 设计 token：四主题（对齐 useTheme() 语义 token） ========== */
*{box-sizing:border-box;margin:0;padding:0}
:root[data-theme="slate-light"]{--bg:#f1f5f9;--surface:#fff;--surface2:#f8fafc;--inset:#eef2f7;--border:#d8e0ea;--text:#0f172a;--muted:#64748b;--accent:#4f46e5;--accent-soft:#e0e7ff;--accent-fg:#fff;--ok:#15803d;--warn:#b45309;--danger:#b91c1c;--info:#0369a1;--ok-bg:#dcfce7;--warn-bg:#fef3c7;--danger-bg:#fee2e2;--info-bg:#e0f2fe;--grade-a:#15803d;--grade-b:#b45309;--grade-c:#c2410c;--grade-d:#b91c1c;--conf-high:#15803d;--conf-med:#b45309;--conf-low:#b91c1c;--edge-pos:#16a34a;--edge-neg:#dc2626;--link:#4f46e5;--mono-bg:#f1f5f9;--shadow:0 1px 3px rgba(15,23,42,.10);--sk1:#e2e8f0;--sk2:#f1f5f9}
:root[data-theme="deep-space"]{--bg:#0b1220;--surface:#111a2e;--surface2:#16223a;--inset:#0d1626;--border:#24344f;--text:#e2e8f0;--muted:#8ea3c0;--accent:#818cf8;--accent-soft:#232f52;--accent-fg:#0b1220;--ok:#4ade80;--warn:#fbbf24;--danger:#f87171;--info:#38bdf8;--ok-bg:#14532d55;--warn-bg:#713f1255;--danger-bg:#7f1d1d55;--info-bg:#0c4a6e55;--grade-a:#4ade80;--grade-b:#fbbf24;--grade-c:#fb923c;--grade-d:#f87171;--conf-high:#4ade80;--conf-med:#fbbf24;--conf-low:#f87171;--edge-pos:#4ade80;--edge-neg:#f87171;--link:#93c5fd;--mono-bg:#0d1626;--shadow:0 1px 3px rgba(0,0,0,.4);--sk1:#1e2c46;--sk2:#16223a}
:root[data-theme="cyber-terminal"]{--bg:#0a0f0a;--surface:#101a12;--surface2:#142116;--inset:#0c140e;--border:#24401f;--text:#d7f0d7;--muted:#7da37f;--accent:#22c55e;--accent-soft:#12331c;--accent-fg:#04140a;--ok:#4ade80;--warn:#fbbf24;--danger:#f87171;--info:#34d399;--ok-bg:#14532d55;--warn-bg:#713f1255;--danger-bg:#7f1d1d55;--info-bg:#064e3b55;--grade-a:#4ade80;--grade-b:#fbbf24;--grade-c:#fb923c;--grade-d:#f87171;--conf-high:#4ade80;--conf-med:#fbbf24;--conf-low:#f87171;--edge-pos:#4ade80;--edge-neg:#f87171;--link:#6ee7b7;--mono-bg:#0c140e;--shadow:0 1px 3px rgba(0,0,0,.5);--sk1:#1a2e1d;--sk2:#142116}
:root[data-theme="royal-purple"]{--bg:#150e24;--surface:#1e1533;--surface2:#261b40;--inset:#181029;--border:#3a2a5e;--text:#e9e4f5;--muted:#a593cc;--accent:#a78bfa;--accent-soft:#322356;--accent-fg:#150e24;--ok:#4ade80;--warn:#fbbf24;--danger:#f87171;--info:#c084fc;--ok-bg:#14532d55;--warn-bg:#713f1255;--danger-bg:#7f1d1d55;--info-bg:#581c8755;--grade-a:#4ade80;--grade-b:#fbbf24;--grade-c:#fb923c;--grade-d:#f87171;--conf-high:#4ade80;--conf-med:#fbbf24;--conf-low:#f87171;--edge-pos:#4ade80;--edge-neg:#f87171;--link:#c4b5fd;--mono-bg:#181029;--shadow:0 1px 3px rgba(0,0,0,.45);--sk1:#2c2149;--sk2:#261b40}
/* ========== 基础 ========== */
html{font-size:14px}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace}
.muted{color:var(--muted)}
.small{font-size:.85em}
a{color:var(--link);text-decoration:none;cursor:pointer}
h1{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:.95rem;font-weight:600}
h3{font-size:.88rem;font-weight:600}
::selection{background:var(--accent-soft)}
/* ========== 壳 ========== */
#topbar{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
#topbar .logo{font-weight:800;font-size:1.05rem;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
#topbar .logo .dot{width:10px;height:10px;border-radius:3px;background:var(--accent)}
#topbar nav{display:flex;gap:2px;margin-left:8px}
#topbar nav a{padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:.9rem}
#topbar nav a.on{background:var(--accent-soft);color:var(--accent)}
#topbar .sp{flex:1}
#topbar select,#topbar .langbtn,#topbar .askbtn{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:.82rem;cursor:pointer}
#topbar .askbtn{background:var(--accent);color:var(--accent-fg);font-weight:700;border-color:var(--accent)}
#subnav{display:flex;gap:4px;padding:8px 16px;background:var(--surface2);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:52px;z-index:40}
#subnav a{white-space:nowrap;padding:5px 12px;border-radius:999px;font-size:.84rem;color:var(--muted);border:1px solid transparent}
#subnav a.on{background:var(--surface);color:var(--accent);border-color:var(--accent);font-weight:600}
#view{padding:20px 16px 80px;max-width:1440px;margin:0 auto}
/* ========== 通用组件 ========== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.88rem;font-weight:600;cursor:pointer;min-height:34px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-fg)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.sm{padding:4px 10px;font-size:.8rem;min-height:28px}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:700;border:1px solid var(--border);color:var(--muted);background:var(--surface2)}
.badge.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.badge.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.badge.danger{color:var(--danger);background:var(--danger-bg);border-color:transparent}
.badge.info{color:var(--info);background:var(--info-bg);border-color:transparent}
.badge.accent{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.badge.ga{color:var(--grade-a);background:var(--ok-bg);border-color:transparent}
.badge.gb{color:var(--grade-b);background:var(--warn-bg);border-color:transparent}
.badge.gc{color:var(--grade-c);background:var(--warn-bg);border-color:transparent}
.badge.gd{color:var(--grade-d);background:var(--danger-bg);border-color:transparent}
.badge.outline{background:transparent;border-style:dashed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:.84rem;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.banner{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:10px;font-size:.88rem;border:1px solid transparent;margin-bottom:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.danger{background:var(--danger-bg);color:var(--danger)}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.neutral{background:var(--inset);color:var(--muted)}
.note{font-size:.8rem;color:var(--info);background:var(--info-bg);border-left:3px solid var(--info);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.table{width:100%;border-collapse:collapse;font-size:.86rem}
.table th{text-align:left;padding:8px 10px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.table tr:hover td{background:var(--surface2)}
.input,select.input,textarea.input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:.9rem;font-family:inherit}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px;font-weight:600}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.kpi .v{font-size:1.5rem;font-weight:800;font-family:ui-monospace,monospace}
.kpi .l{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tabs a{padding:8px 14px;font-size:.88rem;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.contract-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.76rem;color:var(--muted);background:var(--inset);border:1px dashed var(--border);border-radius:8px;padding:6px 12px;margin-bottom:14px}
.contract-bar b{color:var(--info)}
/* 骨架屏 / 状态块 */
.skeleton{border-radius:8px;background:linear-gradient(90deg,var(--sk1) 25%,var(--sk2) 50%,var(--sk1) 75%);background-size:200% 100%;animation:sk 1.2s infinite;min-height:14px}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skeleton{animation:none}}
.state-block{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 20px;text-align:center;border:1px dashed var(--border);border-radius:12px;background:var(--surface2)}
.state-block .ic{width:40px;height:40px;opacity:.6}
.state-block.err{border-color:var(--danger);background:var(--danger-bg)}
.state-block.err .t{color:var(--danger)}
/* 弹层 */
#modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100}
#modal-mask.open{display:flex}
#modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;max-width:640px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#drawer{position:fixed;top:0;right:-480px;width:460px;max-width:94vw;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:100;transition:right .22s ease;overflow-y:auto;padding:20px;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
#drawer.open{right:0}
#toast-wrap{position:fixed;top:64px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:10px 16px;font-size:.86rem;box-shadow:var(--shadow);min-width:240px}
.toast.ok{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--warn)}.toast.err{border-left-color:var(--danger)}
/* 完整度环 */
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;font-family:monospace}
/* 聊天气泡 */
.msg{display:flex;gap:10px;margin-bottom:14px}
.msg .av{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800}
.msg.user .av{background:var(--accent-soft);color:var(--accent)}
.msg.ai .av{background:var(--ok-bg);color:var(--ok)}
.msg .bubble{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;flex:1;font-size:.9rem}
.msg.user .bubble{background:var(--accent-soft);border-color:transparent}
.citation{background:var(--inset);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 12px;margin-top:8px;font-size:.8rem}
.frame-log{font-size:.74rem;font-family:monospace}
.frame-log .f{padding:3px 8px;border-bottom:1px dashed var(--border);display:flex;gap:8px}
.frame-log .ft{font-weight:800;min-width:52px}
.cursor-blink{display:inline-block;width:8px;height:14px;background:var(--accent);animation:blk 1s steps(2) infinite;vertical-align:-2px}
@keyframes blk{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cursor-blink{animation:none}}
/* 时间线 */
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl .ti{position:relative;margin-bottom:14px}
.tl .ti:before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2.5px solid var(--muted)}
.tl .ti.ok:before{border-color:var(--ok)}
.tl .ti.cur:before{border-color:var(--accent);background:var(--accent)}
.tl .ti.bad:before{border-color:var(--danger)}
/* 向导 */
.wiz{display:flex;gap:0;margin-bottom:18px}
.wiz .st{flex:1;text-align:center;font-size:.8rem;color:var(--muted);padding:8px 4px;border-bottom:3px solid var(--border);font-weight:600}
.wiz .st.on{color:var(--accent);border-bottom-color:var(--accent)}
.wiz .st.done{color:var(--ok);border-bottom-color:var(--ok)}
/* 因果图 */
.causal-svg text{fill:var(--text);font-size:11px;font-weight:600}
.causal-svg .cn{fill:var(--surface);stroke:var(--accent);stroke-width:1.5;cursor:pointer}
.causal-svg .cn.unv{stroke-dasharray:4 3;stroke:var(--warn)}
.meter{height:8px;border-radius:99px;background:var(--inset);overflow:hidden}
.meter>div{height:100%;border-radius:99px}
.hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.tag{font-size:.72rem;padding:1px 7px;border-radius:6px;background:var(--inset);color:var(--muted);font-weight:600}
.progress-steps{display:flex;flex-direction:column;gap:6px}
/* 404 */
.big404{font-size:5rem;font-weight:900;color:var(--muted);opacity:.35;font-family:monospace}
/* 四问面板 */
.q-panel{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media(max-width:900px){.q-panel{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.q-panel{grid-template-columns:1fr}}
.q-panel .q-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.q-panel .q-card h3{margin-bottom:10px;display:flex;align-items:center;gap:6px}
.q-panel .q-card .q-list{display:flex;flex-direction:column;gap:8px}
.q-panel .q-card .q-item{padding:8px 10px;border-radius:8px;background:var(--inset);font-size:.84rem;cursor:pointer}
.q-panel .q-card .q-item:hover{background:var(--accent-soft)}
.q-panel .q-card .q-item .q-title{font-weight:600}
.q-panel .q-card .q-item .q-sub{font-size:.76rem;color:var(--muted);margin-top:2px}
/* Ask ECOS 浮动入口 */
#ask-fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-fg);border:none;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer;z-index:90;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800;transition:transform .2s}
#ask-fab:hover{transform:scale(1.08)}
#ask-panel{position:fixed;bottom:88px;right:24px;width:380px;max-width:94vw;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;z-index:90;box-shadow:0 8px 32px rgba(0,0,0,.2);display:none}
#ask-panel.open{display:block}
#ask-panel input{margin-bottom:8px}
/* 沙盘画布 */
.canvas-wrap{background:var(--inset);border:1px solid var(--border);border-radius:12px;overflow:auto;position:relative}
.sec-band{margin:10px;padding:8px 12px;border:1.5px dashed var(--warn);border-radius:10px;color:var(--warn);font-size:.78rem;font-weight:700;background:var(--warn-bg);text-align:center}
.layer{display:flex;align-items:center;gap:0;padding:6px 16px}
.layer .lt{width:86px;flex:none;font-size:.76rem;color:var(--muted);font-weight:700;text-align:right;padding-right:12px}
.node{position:relative;z-index:2;background:var(--surface);border:1.5px solid var(--accent);border-radius:10px;padding:7px 12px;font-size:.82rem;font-weight:600;cursor:pointer;min-width:118px;text-align:center;box-shadow:var(--shadow)}
.node:hover{outline:2px solid var(--accent-soft)}
.node.island{border-color:var(--muted);opacity:.62;border-style:dotted}
.node.island:after{content:"孤岛";position:absolute;top:-9px;right:-8px;font-size:.62rem;background:var(--muted);color:var(--surface);padding:1px 6px;border-radius:999px}
.node.plain{border-color:var(--border)}
.edge-lane{display:flex;align-items:center;justify-content:center;min-width:70px;flex:1}
.edge-lane svg{display:block}
.sandbox-ribbon{position:fixed;top:52px;right:-42px;transform:rotate(38deg);background:var(--warn-bg);color:var(--warn);border:1.5px dashed var(--warn);padding:4px 48px;font-weight:800;font-size:.8rem;z-index:60;letter-spacing:.1em}
/* 资产卡片 */
.asset-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s}
.asset-card:hover{border-color:var(--accent)}
.asset-card .asset-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:8px}
.asset-card .asset-title{font-weight:600;font-size:.9rem}
.asset-card .asset-meta{font-size:.76rem;color:var(--muted);margin-top:4px}
/* 看板列 */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.kanban .kanban-col{flex:none;width:260px}
.kanban .kanban-col h3{margin-bottom:8px;padding:6px 10px;border-radius:8px;background:var(--inset)}
.kanban .kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.kanban .kanban-card:hover{border-color:var(--accent)}
footer{padding:24px;text-align:center;color:var(--muted);font-size:.76rem}
</style>
</head>
<body>
<div id="topbar"></div>
<div id="subnav"></div>
<div id="view"></div>
<div id="modal-mask"><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="drawer" role="complementary"></div>
<div id="toast-wrap"></div>
<button id="ask-fab" title="问 ECOS" style="display:none">问</button>
<div id="ask-panel"><input class="input" id="ask-input" placeholder="输入经营问题，Enter 发送" data-enter="askGlobalSend"><button class="btn primary sm" data-act="askGlobalSend">发送</button></div>
<footer>ECOS 前端可交互原型 v2.0 · 产品结构对齐版 · 2026-10-13 · 全部数据为模拟数据</footer>
<script>
"use strict";
/* ================= 全局状态 ================= */
const S = {
  theme: localStorage.getItem('ecos.proto.v2.theme') || 'slate-light',
  locale: localStorage.getItem('ecos.proto.v2.locale') || 'zh-CN',
  demo: 'normal',           // 精简四态：normal/loading/error/forbidden
  sandboxWatermark: false,
  chat: null,               // 智能对话运行态
  agent: { stage:'ask', round:0, slots:{}, grade:null, runStatus:null, steps:[], option:null, published:null, automation:'L1', killSwitch:false, approved:{}, runTimers:[], runHist:[] },
  wb: { bound:{}, activated:{}, layoutSaved:true },
  wizard: { step:1, mode:'FORMAL', baseline:'run-2026Q3-formal', running:false, done:false, dqFixed:false, runProg:0, timer:null },
  cogTab: 'overview',
  cogMind: 'mind-finance-v2',
  cogExpl: false,
  cogAutonomy: 'L1',
  aiFilter: { toolset:'', op:'', status:'' },
  usagePeriod: '7d',
  replayInput: '',
  waQuestion: '',
  waErrSim: '',
  askOpen: false,
};

function ic(n, sz, cls){ sz=sz||15; return '<svg class="ic '+(cls||'')+'" width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(IC[n]||IC['circle-dot'])+'"/></svg>'; }
/* ================= 工具 ================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nav(h){ location.hash = h; }
function fmtNum(n){ return new Intl.NumberFormat(S.locale==='zh-CN'?'zh-CN':'en-US').format(n); }
function fmtMoney(n){ const v=Math.abs(n); const s=(n<0?'-':'')+(v>=10000?(v/10000).toFixed(1)+'万':fmtNum(v)); return S.locale==='zh-CN'?s+' 元':'¥'+s; }
function uid(p){ return (p||'id')+'-'+Math.random().toString(36).slice(2,8); }
function traceId(){ return Array.from({length:4},()=>Math.random().toString(16).slice(2,6)).join('').slice(0,8)+'-'+Math.random().toString(16).slice(2,6)+'-'+Math.random().toString(16).slice(2,6); }
function copyTxt(txt, msg){ try{ navigator.clipboard.writeText(txt); }catch(e){} toast(msg||(T('common.copied')+': '+txt), 'ok'); }
/* ================= 弹层 ================= */
function openModal(html){ const m=document.getElementById('modal-mask'); document.getElementById('modal').innerHTML=html+'<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" data-act="closeModal">'+T('common.close')+'</button></div>'; m.classList.add('open'); }
function closeModal(){ document.getElementById('modal-mask').classList.remove('open'); }
function openDrawer(html){ document.getElementById('drawer').innerHTML=html; document.getElementById('drawer').classList.add('open'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); }
function toast(msg, type){ const w=document.getElementById('toast-wrap'); const el=document.createElement('div'); el.className='toast '+(type||''); el.innerHTML=msg; w.appendChild(el); setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 320); }, 3200); }
/* ================= 路由 ================= */
function parseRoute(){ const h=(location.hash||'#/decision').replace(/^#/,''); const qi=h.indexOf('?'); const path=qi>=0?h.slice(0,qi):h; const query={}; if(qi>=0){ new URLSearchParams(h.slice(qi+1)).forEach((v,k)=>query[k]=v); } const seg=path.split('/').filter(Boolean); return {path, seg, query}; }
function moduleOf(seg){ const m={decision:'decision', scene:'decision', assets:'assets', cog:'assets', aiwork:'aiwork', ai:'aiwork', admin:'admin'}; return m[seg[0]]||'decision'; }
/* ================= 壳渲染 ================= */
const MODULE_HOME = { decision:'#/decision', assets:'#/assets/overview', aiwork:'#/aiwork/chat', admin:'#/admin' };
function renderShell(r){
  const mod = moduleOf(r.seg);
  const demos = ['normal','loading','error','forbidden'];
  document.getElementById('topbar').innerHTML =
    '<div class="logo"><span class="dot"></span>ECOS <span class="tag">'+T('app.tag')+'</span></div>'
    + '<nav>'
    + ['decision','assets','aiwork','admin'].map(m=>'<a data-nav="'+MODULE_HOME[m]+'" class="'+(mod===m?'on':'')+'">'+T('nav.'+m)+'</a>').join('')
    + '</nav><div class="sp"></div>'
    + (S.sandboxWatermark ? '<span class="badge warn">'+ic('zap',12)+' '+T('common.sandbox')+'</span>' : '')
    + '<select id="demo-sel" title="'+T('nav.demo')+'">'+demos.map(d=>'<option value="'+d+'"'+(S.demo===d?' selected':'')+'>'+T('demo.'+d)+'</option>').join('')+'</select>'
    + '<select id="theme-sel">'+['slate-light','deep-space','cyber-terminal','royal-purple'].map(t=>'<option value="'+t+'"'+(S.theme===t?' selected':'')+'>'+t+'</option>').join('')+'</select>'
    + '<button class="langbtn" data-act="toggleLang">'+(S.locale==='zh-CN'?'EN':'中文')+'</button>'
    + '<button class="askbtn" data-act="toggleAsk">'+ic('help',13)+' '+T('nav.askEcos')+'</button>';
  document.getElementById('subnav').innerHTML = subnavFor(mod, r);
  document.getElementById('demo-sel').onchange = e=>{ S.demo=e.target.value; render(); };
  document.getElementById('theme-sel').onchange = e=>{ S.theme=e.target.value; localStorage.setItem('ecos.proto.v2.theme',S.theme); document.documentElement.dataset.theme=S.theme; };
  document.body.querySelectorAll('.sandbox-ribbon').forEach(x=>x.remove());
  if (S.sandboxWatermark){ const d=document.createElement('div'); d.className='sandbox-ribbon'; d.textContent='[ '+T('common.sandboxWatermark')+' · SANDBOX ]'; document.body.appendChild(d); }
  /* Ask ECOS 浮动按钮 */
  const fab=document.getElementById('ask-fab'); const ap=document.getElementById('ask-panel');
  fab.style.display = mod==='aiwork' ? 'none' : 'flex';
  ap.classList.remove('open'); S.askOpen=false;
}
function subnavFor(mod, r){
  const cur = r.path;
  const link = (href, key, on)=> '<a data-nav="'+href+'" class="'+(on?'on':'')+'">'+T(key)+'</a>';
  if (mod==='decision'){
    let s = link('#/decision','dec.nav.overview', !r.seg[1]);
    if (r.seg[1]==='scene' && r.seg[2]) s += link('#/decision/scene/'+r.seg[2],'dec.nav.detail', !r.seg[3]) + link('#/decision/scene/'+r.seg[2]+'/forecast','dec.nav.forecast', r.seg[3]==='forecast') + link('#/decision/scene/'+r.seg[2]+'/ask','dec.nav.ask', r.seg[3]==='ask');
    s += link('#/decision/todo','dec.nav.todo', r.seg[1]==='todo');
    s += link('#/decision/actions','dec.nav.actions', r.seg[1]==='actions');
    s += link('#/decision/feedback','dec.nav.feedback', r.seg[1]==='feedback');
    s += link('#/decision/mind','dec.nav.mind', r.seg[1]==='mind');
    return s;
  }
  if (mod==='assets'){
    return ['overview','evidence','beliefs','models','results','governance'].map(p=>link('#/assets/'+p,'ast.nav.'+p,(r.seg[1]||'overview')===p)).join('');
  }
  if (mod==='aiwork'){
    return ['agents','chat','tools','guardrails','models','replay','usage','monitor','config'].map(p=>link('#/aiwork/'+p+(p==='monitor'?'/'+(r.seg[2]||'run-7001'):''),'ai.nav.'+p,(r.seg[1]||'chat')===p)).join('');
  }
  if (mod==='admin'){
    return link('#/admin','adm.nav.overview', !r.seg[1]);
  }
  return '';
}
function contractBar(basis, route, comps, extra){
  return '<div class="contract-bar"><span>'+T('contract.basis')+' <b>'+esc(basis)+'</b></span><span>·</span><span>'+T('contract.route')+' <b class="mono">'+esc(route)+'</b></span><span>·</span><span>'+T('contract.comps')+' <b>'+esc(comps)+'</b></span>'+(extra?'<span>·</span><span>'+extra+'</span>':'')+'</div>';
}
function fillNote(txt){ return '<div class="note">'+ic('lightbulb',13)+' <b>'+T('contract.fill')+'</b>：'+txt+'</div>'; }
/* ================= 演示状态守卫（精简四态） ================= */
function stateGuard(allowed){
  if (S.demo==='normal' || !allowed.includes(S.demo)) return null;
  const tr = traceId();
  if (S.demo==='loading') return '<div class="card"><div class="col"><div class="skeleton" style="height:22px;width:40%"></div><div class="skeleton" style="height:14px"></div><div class="skeleton" style="height:14px"></div><div class="skeleton" style="height:90px"></div></div><p class="small muted" role="status" style="margin-top:10px">'+T('common.loading')+'…</p></div>';
  if (S.demo==='error') return '<div class="state-block err" role="alert">'+ic('alert-triangle',40)+'<div class="t"><b>'+T('common.errTitle')+'</b></div><p class="small">ECOS-500 · '+T('common.errMsg')+'</p><p class="small mono muted">traceId: '+tr+'</p><div class="row"><button class="btn sm" data-act="copyTrace" data-v="'+tr+'">'+ic('copy',12)+' '+T('common.copyTrace')+'</button><button class="btn sm primary" data-act="demoReset">'+ic('refresh',12)+' '+T('common.retry')+'</button></div></div>';
  if (S.demo==='forbidden') return '<div class="state-block" role="alert">'+ic('lock',40)+'<div><b>'+T('common.forbidden')+'</b></div><p class="small muted">'+T('common.forbiddenHint')+'</p></div>';
  return null;
}
function statusBadge(s){
  const m={draft:'warn',active:'ok',suspended:'info',completed:'info',executing:'ok',published:'ok',approved:'ok',rejected:'danger',pending:'warn',failed:'danger',cancelled:'info',paused:'warn',validating:'info',verified:'ok',adopted:'ok',evidenced:'ok',evaluated:'info',contested:'warn',uncertain:'warn',proposed:'info',reserved:'warn',refuted:'danger',expired:'danger',superseded:'info',revised:'info'};
  let label = T('common.status.'+s);
  if (label === 'common.status.'+s) label = T('ast.status.'+s);
  if (label === 'ast.status.'+s) label = s;
  return '<span class="badge '+(m[s]||'')+'">'+label+'</span>';
}
function confBadge(v){ return '<span class="badge '+(v>=0.8?'ga':v>=0.5?'gb':'gd')+'">'+(v>=0.8?T('cog.hypo.confHigh'):v>=0.5?T('cog.hypo.confMed'):T('cog.hypo.confLow'))+'</span>'; }
function gradeBadge(g){ return '<span class="badge g'+String(g).toLowerCase()+'">L'+g+'</span>'; }
function readinessBadge(g){ return '<span class="badge g'+g.toLowerCase()+'">'+T('wa.readiness.'+g)+' ('+g+')</span>'; }
function meterRow(label, val, color){ return '<div class="row between" style="padding:4px 0"><span class="small">'+esc(label)+'</span><div class="meter" style="width:120px"><div style="width:'+Math.round(val*100)+'%;background:var(--'+(color||'accent')+')"></div></div><b class="small mono">'+Math.round(val*100)+'%</b></div>'; }

  h += '<div class="grid2" style="margin-top:10px"><div><b class="small">'+T('ast.mind.goals')+'</b><ul class="small" style="margin:6px 0 0 18px">'+m.goals.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'
    + '<div><b class="small">'+T('ast.mind.keyQuestions')+'</b><ul class="small" style="margin:6px 0 0 18px">'+m.keyQuestions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></div>';
  h += '</div>';
  /* ② 信念 */
  h += '<div class="card"><h3>'+T('ast.mind.secBeliefs')+'</h3><table class="table" style="margin-top:8px"><thead><tr><th>ID</th><th>'+T('ast.beliefs.title')+'</th><th>'+T('ast.beliefs.confidence')+'</th><th>'+T('ast.beliefs.version')+'</th><th>'+T('common.status')+'</th></tr></thead><tbody>';
  m.beliefIds.forEach(bid=>{
    const b = COG_ASSETS.belief.find(x=>x.id===bid);
    if (!b) return;
    h += '<tr><td class="mono small">'+esc(b.id)+'</td><td>'+esc(b.name)+'</td><td>'+confBadge(b.confidence)+'</td><td><span class="badge accent mono">'+esc(b.version)+'</span></td><td>'+statusBadge(b.status)+'</td></tr>';
  });
  h += '</tbody></table></div>';
  /* ③ 认知假设 */
  h += '<div class="card"><h3>'+T('ast.mind.secHypotheses')+'</h3><table class="table" style="margin-top:8px"><thead><tr><th>ID</th><th>'+T('ast.evidence.tabHypothesis')+'</th><th>'+T('ast.beliefs.confidence')+'</th><th>'+T('common.status')+'</th></tr></thead><tbody>';
  m.hypothesisIds.forEach(hid=>{
    const hy = COG_ASSETS.hypothesis.find(x=>x.id===hid);
    if (!hy) return;
    h += '<tr><td class="mono small">'+esc(hy.id)+'</td><td>'+esc(hy.claim)+'</td><td>'+confBadge(hy.confidence)+'</td><td>'+statusBadge(hy.status)+'</td></tr>';
  });
  h += '</tbody></table></div>';
  /* ④ 证据关联 */
  h += '<div class="card"><h3>'+T('ast.mind.secEvidence')+'</h3><p class="small muted" style="margin:4px 0 8px">'+T('ast.mind.evRefNote')+'</p>';
  h += '<table class="table"><thead><tr><th>'+T('ast.mind.evidence')+'</th><th>'+T('ast.mind.domain')+'</th><th>'+T('ast.mind.ver')+'</th><th>'+T('ast.evidence.support')+'/'+T('ast.evidence.refute')+'</th><th>'+T('ast.mind.reason')+'</th><th>'+T('ast.mind.refAt')+'</th></tr></thead><tbody>';
  m.evidenceRefs.forEach(e=>{
    const relCls = e.relation==='support'?'ok':(e.relation==='refute'?'danger':'gb');
    h += '<tr><td class="mono small">'+esc(e.ref)+'</td><td><span class="badge info">'+esc(e.domain)+'</span></td><td class="mono small">'+esc(e.ver)+'</td><td><span class="badge '+relCls+'">'+T('ast.mind.relation.'+e.relation)+'</span></td><td class="small">'+esc(e.reason)+'</td><td class="small mono">'+esc(e.at)+'</td></tr>';
  });
  h += '</tbody></table></div>';
  /* ⑤ 解释结构 */
  h += '<div class="card"><h3>'+T('ast.mind.secExplanation')+'</h3><p class="small" style="margin-top:8px;line-height:1.8">'+esc(m.explanation)+'</p></div>';
  /* ⑥ 演化与治理 */
  h += '<div class="card"><h3>'+T('ast.mind.secEvolution')+' · '+T('ast.mind.verHistory')+'</h3><div class="tl" style="margin-top:12px">';
  m.versions.forEach(v=>{
    h += '<div class="ti '+(v.state||'')+'"><div><b class="mono small">'+esc(v.ver)+'</b> <span class="small muted">'+esc(v.at)+' · '+esc(v.by)+'</span><div class="small" style="margin-top:2px">'+esc(v.reason)+'</div></div></div>';
  });
  h += '</div></div>';
  /* W Agent 候选更新 */
  h += '<div class="card"><h3>'+T('ast.mind.candidates')+'</h3><p class="small muted" style="margin:4px 0 10px">'+T('ast.mind.candidatesNote')+'</p>';
  if (!m.candidates.length){
    h += '<div class="small muted">'+T('ast.mind.noCandidates')+'</div>';
  } else {
    m.candidates.forEach(c=>{
      h += '<div class="row between" style="padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px"><div><div class="small"><b>'+esc(c.from)+'</b></div><div class="small" style="margin-top:4px">'+esc(c.change)+'</div><div class="small mono muted" style="margin-top:4px">'+esc(c.evidence)+'</div></div>';
      if (c.status==='pending'){
        h += '<div class="row" style="gap:8px"><button class="btn sm primary" data-act="mindCand" data-v="'+esc(c.id)+'|'+esc(m.id)+'|accept">'+T('ast.mind.candAccept')+'</button><button class="btn sm danger" data-act="mindCand" data-v="'+esc(c.id)+'|'+esc(m.id)+'|reject">'+T('ast.mind.candReject')+'</button></div>';
      } else if (c.status==='submitted'){
        h += '<span class="badge ok">'+T('ast.mind.candSubmitted')+'</span>';
      } else {
        h += '<span class="badge danger">'+T('ast.mind.candWasRejected')+'</span>';
      }
      h += '</div>';
    });
  }
  h += '</div>';
  return h;
};

/* ===================== SSE 帧引擎与 W Agent 运行模拟 ===================== */
function frameStr(f){
  if (f.type==='meta') return 'meta: runId='+esc(f.runId)+' caliber='+(f.caliber?esc(f.caliber):'—')+' asOf='+esc(f.asOf);
  if (f.type==='step'){
    let s = 'step: '+esc(f.name)+' ['+esc(f.status)+']';
    if (f.tool) s += ' tool='+esc(f.tool);
    if (f.decision) s += ' decision='+esc(f.decision);
    if (f.missingSlots) s += ' missing='+f.missingSlots.join(',');
    return s;
  }
  if (f.type==='token') return 'token: count='+f.count;
  if (f.type==='delta') return 'delta: "'+esc(f.text).slice(0,60)+(f.text.length>60?'…':'')+'"';
  if (f.type==='citation') return 'citation: run='+esc(f.runId)+' evidence=['+f.evidence.map(esc).join(', ')+']';
  if (f.type==='error') return 'error: '+esc(f.code)+' '+esc(f.message)+(f.retryable?(' ['+T('ai.error.retryable')+']'):' ['+T('ai.error.notRetryable')+']');
  if (f.type==='done') return 'done: status='+esc(f.status)+' turns='+f.turns;
  return esc(f.type);
}

function frameLogHtml(frames){
  if (!frames || !frames.length) return '<div class="frame-log muted small" style="padding:6px 8px;border:1px dashed var(--border);border-radius:6px">'+T('ai.chat.frames')+': —</div>';
  return '<div class="frame-log" style="max-height:140px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:4px"><div class="small muted" style="padding:4px 8px;border-bottom:1px dashed var(--border)">'+T('ai.chat.frames')+' ('+T('ai.chat.framesGot')+': '+frames.length+')</div>'+frames.map(f=>'<div class="f"><span class="ft">'+esc(f.type)+'</span><span>'+frameStr(f)+'</span></div>').join('')+'</div>';
}

function msgHtml(m){
  if (m.role==='user') return '<div class="msg user"><div class="av">U</div><div class="bubble">'+esc(m.text)+'</div></div>';
  let cite = '';
  if (m.citations && m.citations.length) cite = '<div class="citation">'+ic('git',12)+' '+m.citations.map(esc).join(' · ')+'</div>';
  return '<div class="msg ai"><div class="av">AI</div><div class="bubble">'+esc(m.text).replace(/\n/g,'<br>')+cite+'</div></div>';
}

function chatInit(){
  if (S.chat) return;
  S.chat = {
    sessions: AI.sessions.slice(),
    curSession: 's1',
    flowIdx: 0,
    frames: [],
    curFrameIdx: 0,
    timer: null,
    streaming: false,
    interrupted: false,
    messages: [
      {role:'ai', text:'你好，我是 ECOS 智能助手。可基于场景上下文回答经营决策类问题（模拟 SSE 流式响应，三回合循环：正常 / 澄清 / 错误）。', citations:[], frames:[]},
    ],
  };
}

function chatStart(){
  if (!S.chat) chatInit();
  if (S.chat.streaming) return;
  S.chat.frames = [];
  S.chat.curFrameIdx = 0;
  S.chat.streaming = true;
  S.chat.interrupted = false;
  S.chat.messages.push({role:'ai', text:'', citations:[], frames:[], streaming:true});
  render();
  chatNext();
}

function chatNext(){
  if (!S.chat || !S.chat.streaming || S.chat.interrupted) return;
  const flow = SSE_FLOWS[S.chat.flowIdx % SSE_FLOWS.length];
  if (S.chat.curFrameIdx >= flow.length){
    S.chat.streaming = false;
    S.chat.flowIdx++;
    const last = S.chat.messages[S.chat.messages.length-1];
    if (last && last.streaming) last.streaming = false;
    render();
    return;
  }
  const f = flow[S.chat.curFrameIdx];
  S.chat.frames.push(f);
  const last = S.chat.messages[S.chat.messages.length-1];
  if (last && last.streaming){
    last.frames = S.chat.frames.slice();
    if (f.type==='delta') last.text += f.text;
    else if (f.type==='citation') last.citations = [T('ai.citation.run')+'='+f.runId, T('ai.citation.caliber')+'='+(f.caliber||'—'), T('ai.citation.asOf')+'='+f.asOf, T('ai.citation.evidence')+': '+f.evidence.join(', ')];
    else if (f.type==='error') last.text = T('ai.error.'+f.code)+': '+f.message+' ['+(f.retryable?T('ai.error.retryable'):T('ai.error.notRetryable'))+']';
    else if (f.type==='step' && f.status==='DENY') last.text = T('ai.chat.refusalClarify')+(f.missingSlots?(': '+f.missingSlots.join(', ')):'');
  }
  S.chat.curFrameIdx++;
  render();
  S.chat.timer = setTimeout(chatNext, 700);
}

function chatCut(){
  if (!S.chat || !S.chat.streaming) return;
  if (S.chat.timer){ clearTimeout(S.chat.timer); S.chat.timer = null; }
  S.chat.streaming = false;
  S.chat.interrupted = true;
  const last = S.chat.messages[S.chat.messages.length-1];
  if (last && last.streaming) last.streaming = false;
  render();
}

function chatResume(){
  if (!S.chat || !S.chat.interrupted) return;
  S.chat.interrupted = false;
  S.chat.streaming = true;
  chatNext();
}

function waAskInit(){
  if (S.waAsk) return;
  S.waAsk = {
    flowIdx: 0,
    frames: [],
    curFrameIdx: 0,
    timer: null,
    streaming: false,
    interrupted: false,
    messages: [
      {role:'ai', text:'已加载场景上下文（口径 + 截止 + 完整度）。请输入经营问题。', citations:[], frames:[]},
    ],
  };
}

function waAskStart(){
  if (!S.waAsk) waAskInit();
  if (S.waAsk.streaming) return;
  S.waAsk.frames = [];
  S.waAsk.curFrameIdx = 0;
  S.waAsk.streaming = true;
  S.waAsk.interrupted = false;
  S.waAsk.messages.push({role:'ai', text:'', citations:[], frames:[], streaming:true});
  render();
  waAskNext();
}

function waAskNext(){
  if (!S.waAsk || !S.waAsk.streaming || S.waAsk.interrupted) return;
  const flow = SSE_FLOWS[S.waAsk.flowIdx % SSE_FLOWS.length];
  if (S.waAsk.curFrameIdx >= flow.length){
    S.waAsk.streaming = false;
    S.waAsk.flowIdx++;
    const last = S.waAsk.messages[S.waAsk.messages.length-1];
    if (last && last.streaming) last.streaming = false;
    render();
    return;
  }
  const f = flow[S.waAsk.curFrameIdx];
  S.waAsk.frames.push(f);
  const last = S.waAsk.messages[S.waAsk.messages.length-1];
  if (last && last.streaming){
    last.frames = S.waAsk.frames.slice();
    if (f.type==='delta') last.text += f.text;
    else if (f.type==='citation') last.citations = [T('ai.citation.run')+'='+f.runId, T('ai.citation.caliber')+'='+(f.caliber||'—'), T('ai.citation.asOf')+'='+f.asOf, T('ai.citation.evidence')+': '+f.evidence.join(', ')];
    else if (f.type==='error') last.text = T('ai.error.'+f.code)+': '+f.message+' ['+(f.retryable?T('ai.error.retryable'):T('ai.error.notRetryable'))+']';
    else if (f.type==='step' && f.status==='DENY') last.text = T('ai.chat.refusalClarify')+(f.missingSlots?(': '+f.missingSlots.join(', ')):'');
  }
  S.waAsk.curFrameIdx++;
  render();
  S.waAsk.timer = setTimeout(waAskNext, 700);
}

function waAskCut(){
  if (!S.waAsk || !S.waAsk.streaming) return;
  if (S.waAsk.timer){ clearTimeout(S.waAsk.timer); S.waAsk.timer = null; }
  S.waAsk.streaming = false;
  S.waAsk.interrupted = true;
  const last = S.waAsk.messages[S.waAsk.messages.length-1];
  if (last && last.streaming) last.streaming = false;
  render();
}

function waAskResume(){
  if (!S.waAsk || !S.waAsk.interrupted) return;
  S.waAsk.interrupted = false;
  S.waAsk.streaming = true;
  waAskNext();
}

function nowStr(){ return new Date().toLocaleTimeString('zh-CN', {hour12:false}); }

function runSim(){
  if (S.agent.runTimers && S.agent.runTimers.length){
    S.agent.runTimers.forEach(t=>clearTimeout(t));
  }
  S.agent.runTimers = [];
  S.agent.runHist = [];
  S.agent.steps = [];
  S.agent.stage = 'plan_validated';
  S.agent.runHist.push({ts: nowStr(), stage:'plan_validated', label:T('wa.run.status.plan_validated')});
  render();
  const seq = [
    {delay:800, stage:'executing', step:{step:1, name:'parse goal', status:'ok', ts:nowStr()}},
    {delay:1600, step:{step:2, name:'check readiness', status:'ok', ts:nowStr()}},
    {delay:2400, step:{step:3, name:'call forecast.run', status:'ok', tool:'forecast.run', ts:nowStr()}},
    {delay:3200, step:{step:4, name:'aggregate result', status:'ok', ts:nowStr()}},
    {delay:4000, step:{step:5, name:'generate narrative', status:'ok', ts:nowStr()}},
    {delay:4800, stage:'completed_degraded', label:T('wa.run.status.completed_degraded')},
  ];
  seq.forEach(s=>{
    const tid = setTimeout(()=>{
      if (S.agent.killSwitch) return;
      if (s.stage){
        S.agent.stage = s.stage;
        S.agent.runHist.push({ts: nowStr(), stage:s.stage, label:s.label||('Step '+s.step.step)});
      }
      if (s.step){
        S.agent.steps.push(s.step);
        S.agent.runHist.push({ts: s.step.ts, stage:S.agent.stage, label:'Step '+s.step.step+': '+s.step.name});
      }
      render();
    }, s.delay);
    S.agent.runTimers.push(tid);
  });
}

function runKill(on){
  if (S.agent.runTimers && S.agent.runTimers.length){
    S.agent.runTimers.forEach(t=>clearTimeout(t));
    S.agent.runTimers = [];
  }
  S.agent.killSwitch = on;
  if (on){
    S.agent.stage = 'paused';
    S.agent.runHist.push({ts: nowStr(), stage:'paused', label:T('wa.run.status.paused')});
  } else if (S.agent.stage === 'paused'){
    S.agent.stage = 'executing';
  }
  render();
  toast(on?T('wa.admin.killOn'):T('wa.admin.killOff'), 'warn');
}

function runCancel(){
  if (S.agent.runTimers && S.agent.runTimers.length){
    S.agent.runTimers.forEach(t=>clearTimeout(t));
    S.agent.runTimers = [];
  }
  S.agent.stage = 'cancelled';
  S.agent.runHist.push({ts: nowStr(), stage:'cancelled', label:T('wa.run.status.cancelled')});
  render();
  toast(T('wa.monitor.cancel')+'：'+T('wa.run.status.cancelled'), 'warn');
}

/* ===================== 路由分发 ===================== */
function render(){
  const r = parseRoute();
  renderShell(r);
  const mod = moduleOf(r.seg);
  let html = '';
  try {
    if (mod === 'decision'){
      if (!r.seg[1]) html = PAGES.decOverview();
      else if (r.seg[1] === 'scene' && r.seg[2]){
        const sc = getSc(r.seg[2]);
        if (!sc) html = PAGES.notFound();
        else if (r.seg[3] === 'forecast') html = PAGES.decForecast(r.seg[2]);
        else if (r.seg[3] === 'ask') html = PAGES.decAsk(r.seg[2]);
        else html = PAGES.decDetail(r.seg[2]);
      }
      else if (r.seg[1] === 'todo') html = PAGES.decTodo();
      else if (r.seg[1] === 'actions') html = PAGES.decActions();
      else if (r.seg[1] === 'feedback') html = PAGES.decFeedback();
      else if (r.seg[1] === 'mind') html = r.seg[2] ? PAGES.decMindDetail(r.seg[2]) : PAGES.decMinds();
      else html = PAGES.notFound();
    }
    else if (mod === 'assets'){
      const p = r.seg[1] || 'overview';
      if (p === 'overview') html = PAGES.astOverview();
      else if (p === 'evidence') html = PAGES.astEvidence();
      else if (p === 'beliefs') html = PAGES.astBeliefs();
      else if (p === 'models') html = PAGES.astModels();
      else if (p === 'results') html = PAGES.astResults();
      else if (p === 'governance') html = PAGES.astGovernance();
      else html = PAGES.notFound();
    }
    else if (mod === 'aiwork'){
      const p = r.seg[1] || 'chat';
      if (p === 'agents') html = PAGES.aiAgents();
      else if (p === 'chat') html = PAGES.aiChat();
      else if (p === 'tools') html = PAGES.aiTools();
      else if (p === 'guardrails') html = PAGES.aiGuardrails();
      else if (p === 'models') html = PAGES.aiModels();
      else if (p === 'replay') html = PAGES.aiReplay(r.seg[2]||'');
      else if (p === 'usage') html = PAGES.aiUsage();
      else if (p === 'monitor') html = PAGES.aiMonitor(r.seg[2]||'run-7001');
      else if (p === 'config') html = PAGES.aiConfig();
      else html = PAGES.notFound();
    }
    else if (mod === 'admin'){
      html = PAGES.admOverview();
    }
    else {
      html = PAGES.notFound();
    }
  } catch(err){
    html = '<div class="state-block err" role="alert">'+ic('alert-triangle',40)+'<div class="t"><b>渲染异常</b></div><p class="small mono">'+esc(err && err.message || String(err))+'</p><button class="btn sm" data-act="demoReset">'+T('common.retry')+'</button></div>';
    if (window.console && console.error) console.error(err);
  }
  const view = document.getElementById('view');
  if (view){
    view.innerHTML = html;
    view.scrollTop = 0;
  }
  const ap = document.getElementById('ask-panel');
  if (ap){ ap.classList.toggle('open', !!S.askOpen); }
}

/* ===================== 启动 ===================== */
function boot(){
  document.documentElement.dataset.theme = S.theme;
  const fab = document.getElementById('ask-fab');
  if (fab){ fab.addEventListener('click', function(){ ACT.toggleAsk(); }); }
  window.addEventListener('hashchange', render);
  render();
}
boot();

</script>
</body>
</html>
