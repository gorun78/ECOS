# =====================================================================
# wagent-v1.yaml — W Agent 编排面（wagent v1）机器可读 REST/SSE 契约
# ---------------------------------------------------------------------
# 溯源：《详细设计-10-W Agent编排与DIK-C赋能》§五（W245~W277 ↔ C227~C259）。
#   · 路径/operationId 单源 = ecos_backend/engine/ai-engine/ai-engine-impl/
#     src/main/java/com/chinacreator/gzcm/engine/ai/wagent/WAgentApiPaths.java
#     （本文件与其同源，参数名字面量取 P_* 常量口径；§5.2 表 24 端点 / 25 operationId
#     全量覆盖，另附 §5.2 表外能力探测端点 getRunProgressCapability）。
#   · 错误码单源 = WAgentErrorCodes.java（§5.3 十一码 + 实测第 12 枚举
#     ECOS_WA_CALIBER_LOCKED，409，reviseGoal 口径锁专用）。
#   · 响应包裹 = runtime/common-api ApiResponse.java 实测字段
#     {code:int, errorCode:String, message, data, timestamp:Long, traceId:String}。
#     注意：卷10 §5.3 脚注"traceId 字段实测不存在（卷06 C135 待补）"已被现源
#     码超越——ApiResponse.java:60 在位 traceId 字段并有 withTraceId()（:99），
#     C135 已补齐，本契约按实测登记。
# ---------------------------------------------------------------------
# 工件属性（诚实声明，W277/P-5）：
#   1. 本文件是 wagent 面**首个手工登记的机器可读契约**（R2-C/#133 交付），
#      **不是 springdoc 生成物**——springdoc 挂载未实测，禁写"已生成"。
#   2. x-implementation-status: implemented = Controller 逐行实测（行号见各端点）；
#      partial = 端点在位但按设计依赖降级（如 SSE 经 P-4）；
#      planned = 仅 WAgentApiPaths 路径常量在位，Controller 未落地
#      （#11~#16 归 R2-B、#17~#24 归 R3-A 批次）。
#   3. 契约 ↔ Controller 字段级一致性门禁归 P-5 后续，本文件 DTO 仅到
#      信封级（ApiResponse）+ 设计级 data 占位（additionalProperties: true），
#      禁据此生成客户端假象。
#   4. 安全口径：wagent 全部端点要求 JWT 认证；禁进入
#      AnonymousEndpointRegistry.permitAllPatterns() 匿名面（WAgentApiPaths 头注）。
#   5. 前缀策略（§5.1，只增不改）：正典 /api/v1/wagent；双路径 /api/wagent 经
#      VersionPrefixRewriteFilter REVERSE 映射收敛到 v1，Controller 禁直接映射裸前缀。
#      不复用已混乱的 /api/v1/agent 族（X-2/W252/R-43）。
# ---------------------------------------------------------------------
# 【2026-10-12 全量设计复盘回写】v1.0.0 → v1.0.1：
#   ① servers 的 ai-engine 直连端口按实测订正（18085 系 v1 legacy 幽灵端口，见 servers 注记）；
#   ② planned 面 readiness/evidence/candidates 三处端点定义对齐前端消费签名
#      （ReadinessCard.tsx:2 / EvidenceDrawer.tsx:4 / CandidateDiffView.tsx:6，均为组件头注声明的
#      消费路径；WAgentApiPaths 常量现态与前端签名的收敛属 R2-B/R3-A 批次事项，
#      各端点 x-correction-2026-10-12 已逐条登记差异）；implemented 面不动。
# =====================================================================
openapi: 3.0.3
info:
  title: ECOS W Agent 编排面 API（wagent v1）
  version: 1.0.1   # 2026-10-12 复盘回写：servers 端口订正（18085→18084/19084 实测）+ planned 面
                   # readiness/evidence/candidates-review 签名对齐前端消费位点（见各端点 x-correction-2026-10-12）
  description: |
    W Agent 编排与 DIK-C 赋能对外契约（详细设计-10 §5.2 首批 24 端点 / 25 operationId，REST + SSE）。
    错误语义见 §5.3 十一错误码（components.responses 按 wire code 登记）；
    错误码经 `ApiResponse.errorCode` 字段区分，同一 HTTP 状态可承载多个 E- 码。
    进度通道：SSE（#7）依赖 P-4，当前实测恒为如实 502 `E-WA-DEP` + 轮询回落
    （WAgentRunController:111~125，禁伪流、禁 200 空挂）；能力探测见
    `getRunProgressCapability`（§5.2 表外，F10-16）。
  contact:
    name: ECOS 卷10 R2-C（W277/P-5）
  license:
    name: Proprietary
servers:
  # 双路径口径（§5.1）：网关侧 /api/v1/wagent/** 与 /api/wagent/** 各登记一遍，
  # 后者经 VersionPrefixRewriteFilter REVERSE 收敛到 v1 正典。
  # 路径本体一律挂正典前缀（§5.2 表基准）；legacy 形态仅入口等价，不另列 paths。
  - url: http://localhost:8080
    description: 网关聚合入口（gateway:8080；正典前缀 /api/v1/wagent，legacy 双路径 /api/wagent 等价）
  - url: http://localhost:18084
    description: |
      2026-10-12 复盘订正：原登记 18085 与代码不符——18085 仅存在于 v1 legacy 幽灵工程
      （ecos_backend/archive/legacy/services-ghost/api-gateway）与 docker-compose.app-v1-legacy.yml，
      现网 ai-engine 面无此端口。实测属主部署面 = services/aiming :18084
      （services/aiming/src/main/resources/application.yml:3 `port: 18084`）；
      ai-engine-boot 调试态 = 19084（engine/ai-engine/ai-engine-boot/src/main/resources/application.yml:2-3，
      boot 端口 = 服务端口 +1000 口径）。平台 API 基线仍以 gateway :8080 承流为准入面，
      本直连面仅内部调试（R2-C 注记）。
tags:
  - name: goals
    description: §5.2 #1~#2 Goal 生命周期（口径变更⇒新版本；被引用则 409 ECOS_WA_CALIBER_LOCKED）
  - name: questions
    description: §5.2 #3~#4 Question（意图识别 + 澄清返回 CLARIFY，F10-06/07）
  - name: runs
    description: §5.2 #5~#10 Run 编排（状态机/幂等/预算/awaiting_input/awaiting_approval/cancel）
  - name: flags
    description: §5.2 #11 Kill Switch（租户/系统级；仅 admin 角色 + 审计，F10-21）
  - name: readiness
    description: §5.2 #12~#13 Readiness（等级+缺项+缺口；补齐循环 ≤3，F10-08/09）
  - name: tools
    description: §5.2 #14~#16 工具契约（渐进披露 F10-18；契约测试五关 F10-17；只 active 可召回）
  - name: candidates
    description: §5.2 #17~#20 Candidate 写通道（四眼评审；publish 需 approval_token + pre-commit 裁决 + Git 归档，F10-21/23）
  - name: evidence
    description: §5.2 #21~#22 Claim/Evidence 追溯链（F10-24）
  - name: decisions
    description: §5.2 #23 决策留档（引用 pinned 评估记录）
  - name: actions
    description: §5.2 #24 行动草稿/提交（属主 ai-engine，经属主 Engine 写端点，Agent 不写对方表，REQ-WAG-02/R-32①）

security:
  - bearerAuth: []

paths:
  # ───────────────────────────── Goals（§5.2 #1~#2）─────────────────────────────
  /api/v1/wagent/goals:
    post:
      tags: [goals]
      operationId: createGoal
      summary: "#1 创建 Goal（201；幂等键头可选）"
      x-implementation-status: implemented   # WAgentGoalController:60
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalCreateRequest"
      responses:
        "201":
          description: 创建成功；Location 头指向 /api/v1/wagent/goals/{goalId}
          headers:
            Location:
              schema: { type: string }
              description: 资源定位（WAgentGoalController:70~71 resolve(GOAL_REVISE, goalId)）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Goal"
        "400": { $ref: "#/components/responses/E-VALIDATION" }
        "401": { $ref: "#/components/responses/E-AUTH" }
        "403": { $ref: "#/components/responses/E-POLICY" }
        "429": { $ref: "#/components/responses/E-RATE" }
        "500": { $ref: "#/components/responses/E-INTERNAL" }

  /api/v1/wagent/goals/{goalId}:
    patch:
      tags: [goals]
      operationId: reviseGoal
      summary: "#2 修订 Goal（口径变更⇒新版本；被引用则 409）"
      x-implementation-status: implemented   # WAgentGoalController:76~77
      parameters:
        - $ref: "#/components/parameters/GoalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalReviseRequest"
      responses:
        "200":
          description: 修订成功（新版本 Goal；口径变更派生新版本号）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Goal"
        "400": { $ref: "#/components/responses/E-VALIDATION" }
        "401": { $ref: "#/components/responses/E-AUTH" }
        "403": { $ref: "#/components/responses/E-POLICY" }
        "404": { $ref: "#/components/responses/E-NOT-FOUND" }
        "409":
          description: |
            状态机冲突或口径锁定：errorCode ∈ { E-WA-STATE, ECOS_WA_CALIBER_LOCKED }
            （后者为 WAgentErrorCodes 第 12 枚举，§5.2 #2 专用）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "500": { $ref: "#/components/responses/E-INTERNAL" }

  # ──────────────────────────── Questions（§5.2 #3~#4）──────────────────────────
  /api/v1/wagent/questions:
    post:
      tags: [questions]
      operationId: createQuestion
      summary: "#3 创建 Question（意图识别 + 澄清返回 CLARIFY）"
      x-implementation-status: implemented   # WAgentQuestionController:61
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionCreateRequest"
      responses:
        "200":
          description: |
            成功。data.disposition ∈ { RESOLVED, CLARIFY }；
            CLARIFY 时携澄清槽位（F10-06/07，不另设 HTTP 状态，语义在体内）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Question"
        "400": { $ref: "#/components/responses/E-VALIDATION" }
        "401": { $ref: "#/components/responses/E-AUTH" }
        "403": { $ref: "#/components/responses/E-POLICY" }
        "429": { $ref: "#/components/responses/E-RATE" }
        "500": { $ref: "#/components/responses/E-INTERNAL" }

  /api/v1/wagent/questions/{questionId}:
    get:
      tags: [questions]
      operationId: getQuestion
      summary: "#4 Question 详情（含 latest_run 摘要）"
      x-implementation-status: implemented   # WAgentQuestionController:85~87
      parameters:
        - $ref: "#/components/parameters/QuestionId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Question"
        "401": { $ref: "#/components/responses/E-AUTH" }
        "403": { $ref: "#/components/responses/E-POLICY" }
        "404": { $ref: "#/components/responses/E-NOT-FOUND" }
        "500": { $ref: "#/components/responses/E-INTERNAL" }

  # ─────────────────────────────── Runs（§5.2 #5~#10）───────────────────────────
  /api/v1/wagent/runs:
    post:
      tags: [runs]
      operationId: startRun
      summary: "#5 启动 Run（Prefer: respond-async 支持 202 + run_id）"
      x-implementation-status: implemented   # WAgentRunController:67
      parameters:
        - $ref: "#/components/parameters/Prefer"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStartRequest"
      responses:
        "200":
          description: 同步通道启动成功，返回 Run 快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Run"
        "202":
          description: "Prefer: respond-async：已受理，data 含 run_id，经 #6 轮询或能力探测取进度"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Run"
        "400": { $ref: "#/components/responses/E-VALIDATION" }
        "401": { $ref: "#/components/responses/E-AUTH" }
        "403": { $ref: "#/components/responses/E-POLICY" }
        "409": { $ref: "#/components/responses/E-IDEMPOTENT-CONFLICT" }
        "429":
          description: "errorCode ∈ { E-RATE（配额超限，退避重试）, E-WA-BUDGET（Run 预算耗尽，提示拆分问题） }"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "502": { $ref: "#/components/responses/E-WA-DEP" }
        "500": { $ref: "#/components/responses/E-INTERNAL" }

  /api/v1/wagent/runs/{runId}:
    get:
      tags: [runs]
      operationId: getRun
      summary: "#6 Run 详情（状态 + 时间线）"
      x-implementation-status: implemented   # WAgentRunController:97~104（timeline 并排返回）
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: 成功（data 含状态机态 + timeline）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Run"
        "401": { $ref: "#/components/responses/E-AUTH" }
        "403": { $ref: "#/components/responses/E-POLICY" }
        "404": { $ref: "#/components/responses/E-NOT-FOUND" }
        "500": { $ref: "#/components/responses/E-INTERNAL" }

  /api/v1/wagent/runs/{runId}/events:
    get:
      tags: [runs]
      operationId: streamRunEvents
      summary: "#7 SSE 进度流（依赖 P-4；Last-Event-ID 续传）"
      description: |
        目标契约（就绪后）：`text/event-stream` + `Last-Event-ID` 断线续传（F10-16）。
        **实测现状（本契约登记口径）**：P-4 未就绪 ⇒ 当前如实返回 502 `E-WA-DEP` +
        轮询回落指引（poll_path 指向 #6；禁伪流、禁 200 空挂），
        见 WAgentRunController:111~125（produces 现为 application/json 如实降级体，
        头注登记"就绪后切 text/event-stream"，#130/R4）。
        `Last-Event-ID` 头在位即透传（:114, :119），不代表流已可用。
      x-implementation-status: partial       # 端点在位，SSE 通道待 P-4
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          required: false
          description: SSE 续传游标（目标契约；当前降级态仅回显是否收到）
          schema: { type: string }
      responses:
        "200":
          description: 目标态：SSE 事件流（P-4 就绪后启用；事件载荷=ecos_wagent_run_event 引用型事件，§6.1）
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 帧流（id/event/data 三元组，data 为 JSON 引用型事件；契约细化随 P-4）
        "401": { $ref: "#/components/responses/E-AUTH" }
        "403": { $ref: "#/components/responses/E-POLICY" }
        "404": { $ref: "#/components/responses/E-NOT-FOUND" }
        "502":
          description: |
            当前实测态：E-WA-DEP 如实降级（SSE 进度通道 P-4/F10-16 未就绪），
            data 含轮询回落指引（poll_path / progress-capability）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "503": { $ref: "#/components/responses/E-WA-DEP" }

  /api/v1/wagent/runs/{runId}/input:
    post:
      tags: [runs]
      operationId: submitRunInput
      summary: "#8 awaiting_input 应答（续跑）"
      x-implementation-status: implemented   # WAgentRunController:137~144
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Prefer"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunInputRequest"
      responses:
        "200":
          description: 应答成功，Run 续跑（awaiting_input ⇒ executing）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Run"
        "400": { $ref: "#/components/responses/E-VALIDATION" }
        "401": { $ref: "#/components/responses/E-AUTH" }
        "403": { $ref: "#/components/responses/E-POLICY" }
        "404": { $ref: "#/components/responses/E-NOT-FOUND" }
        "409": { $ref: "#/components/responses/E-WA-STATE" }
        "500": { $ref: "#/components/responses/E-INTERNAL" }

  /api/v1/wagent/runs/{runId}/approval:
    post:
      tags: [runs]
      operationId: approveRunGate
      summary: "#9 awaiting_approval 人工门（凭证校验）"
      x-implementation-status: implemented   # WAgentRunController:153~155
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunApprovalRequest"
      responses:
        "200":
          description: 审批通过（或拒绝），Run 依状态机推进
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Run"
        "400": { $ref: "#/components/responses/E-VALIDATION" }
        "401": { $ref: "#/components/responses/E-AUTH" }
        "403": { $ref: "#/components/responses/E-POLICY" }
        "404": { $ref: "#/components/responses/E-NOT-FOUND" }
        "409": { $ref: "#/components/responses/E-WA-STATE" }
        "500": { $ref: "#/components/responses/E-INTERNAL" }

  /api/v1/wagent/runs/{runId}/cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: "#10 取消 Run（幂等）"
      x-implementation-status: implemented   # WAgentRunController:169~170
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: 取消完成（重复取消幂等，不报 409）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/Run"
        "401": { $ref: "#/components/responses/E-AUTH" }
        "403": { $ref: "#/components/responses/E-POLICY" }
        "404": { $ref: "#/components/responses/E-NOT-FOUND" }
        "500": { $ref: "#/components/responses/E-INTERNAL" }

  # ─────────────── 进度能力探测（§5.2 表外，F10-16 / RUN_PROGRESS_CAPABILITY）───────────────
  /api/v1/wagent/runs/{runId}/progress-capability:
    get:
      tags: [runs]
      operationId: getRunProgressCapability
      summary: "§5.2 表外（F10-16 能力探测；WAgentApiPaths.RUN_PROGRESS_CAPABILITY）"
      description: |
        返回 sse|polling 二态（SSE 未就绪即回 polling）。
        实测在位：WAgentRunController:128~134（当前恒 polling，#7 降级态的机读镜像）。
        登记依据：本端点属 WAgentApiPaths 单源常量 + Controller 实测，非 §5.2 表 24 端点之列，
        随 #7 同族登记（progress-capability 属主 RunProgressFacade）。
      x-implementation-status: implemented   # WAgentRunController:128
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: 能力位（data.mode ∈ { sse, polling } + 回落指引）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - properties:
                      data:
                        type: object
                        description: 设计级占位，字段收敛随 P-5 门禁
                        additionalProperties: true
        "401": { $ref: "#/components/responses/E-AUTH" }
        "403": { $ref: "#/components/responses/E-POLICY" }
        "404": { $ref: "#/components/responses/E-NOT-FOUND" }
        "500": { $ref: "#/components/responses/E-INTERNAL" }

  # ────────────────────────────── Flags（§5.2 #11）──────────────────────────────
  /api/v1/wagent/flags/kill-switch:
    post:
      tags: [flags]
      operationId: setKillSwitch
      summary: "#11 Kill Switch（租户/系统级；仅 admin 角色 + 审计，F10-21）"
      x-implementation-status: planned       # WAgentApiPaths.FLAGS_KILL_SWITCH 常量在位；Controller 归 R2-B
