        "401": { $ref: "#/components/responses/E-AUTH" }
        "403": { $ref: "#/components/responses/E-POLICY" }
        "404": { $ref: "#/components/responses/E-NOT-FOUND" }
        "502": { $ref: "#/components/responses/E-WA-DEP" }
