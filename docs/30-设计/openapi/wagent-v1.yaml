components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        wagent 面统一 JWT 认证（WAgentApiPaths 头注：禁进入
        AnonymousEndpointRegistry.permitAllPatterns() 匿名面）；
        权限/裁决经 security-engine（ST04/ST05），不可用即默认 DENY（§5.4 GUARDRAIL_FAIL_CLOSED）。

  parameters:
    GoalId:
      name: goalId
      in: path
      required: true
      description: 单源参数名 = WAgentApiPaths.P_GOAL_ID
      schema: { type: string, maxLength: 36 }
    QuestionId:
      name: questionId
      in: path
      required: true
      description: 单源参数名 = WAgentApiPaths.P_QUESTION_ID
      schema: { type: string, maxLength: 36 }
    RunId:
      name: runId
      in: path
      required: true
      description: 单源参数名 = WAgentApiPaths.P_RUN_ID
      schema: { type: string, maxLength: 36 }
    ToolName:
      name: name
      in: path
      required: true
      description: 单源参数名 = WAgentApiPaths.P_NAME（工具名，V266 name 列语义）
      schema: { type: string, maxLength: 100 }
    CandidateId:
      name: candidateId
      in: path
      required: true
      description: 单源参数名 = WAgentApiPaths.P_CANDIDATE_ID
      schema: { type: string, maxLength: 36 }
    ActionId:
      name: actionId
      in: path
      required: true
      description: 单源参数名 = WAgentApiPaths.P_ACTION_ID
      schema: { type: string, maxLength: 36 }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      description: 单源参数名 = WAgentApiPaths.P_EVIDENCE_ID
      schema: { type: string, maxLength: 36 }
    Prefer:
      name: Prefer
      in: header
      required: false
      description: "respond-async：异步受理（startRun 202 + run_id；submitRunInput 同步通道内推进）"
      schema:
        type: string
        example: respond-async
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 幂等键（§5.2 #1 可选/#5 幂等冲突回既有 run_id，E-IDEMPOTENT-CONFLICT）
      schema: { type: string, maxLength: 100 }

  responses:
    # ── §5.3 十一错误码（wire code = WAgentErrorCodes 枚举字面量，components 键名同码）──
    E-VALIDATION:
      description: "E-VALIDATION（400）入参/Schema 校验失败；不可重试；文案指出具体字段"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 400, errorCode: "E-VALIDATION", message: "字段 goal.title 缺失 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-AUTH:
      description: "E-AUTH（401）未认证；引导重新登录；security-engine 不可用亦收敛于此码 + GUARDRAIL_FAIL_CLOSED 审计"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 401, errorCode: "E-AUTH", message: "凭证无效或已过期 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-POLICY:
      description: "E-POLICY（403）裁决拒绝（含 Kill Switch）；可读拒绝理由 + 负责人建议；不泄露对象存在性"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 403, errorCode: "E-POLICY", message: "策略拒绝：写通道需人工审批 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-NOT-FOUND:
      description: "E-NOT-FOUND（404）对象不可见；文案与 403 不可区分（防枚举）"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 404, errorCode: "E-NOT-FOUND", message: "资源不存在或不可见 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-WA-STATE:
      description: "E-WA-STATE（409）状态机冲突 / 口径锁定 / 候选过期；提示当前状态与允许操作"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 409, errorCode: "E-WA-STATE", message: "Run 当前态 awaiting_input 不允许该操作 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-IDEMPOTENT-CONFLICT:
      description: "E-IDEMPOTENT-CONFLICT（409）幂等键冲突；返回既有 run_id"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 409, errorCode: "E-IDEMPOTENT-CONFLICT", message: "幂等键已存在，返回既有 run [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-RATE:
      description: "E-RATE（429）配额/预算超限；可退避重试（委托 LLM_RATE_LIMITED 指数退避 ≤3）；提示剩余额度与降级选项"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 429, errorCode: "E-RATE", message: "租户配额耗尽，请退避后重试 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-WA-BUDGET:
      description: "E-WA-BUDGET（429）Run 预算耗尽；不可重试；提示拆分问题"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 429, errorCode: "E-WA-BUDGET", message: "本次 Run 预算已耗尽，建议拆分问题 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-WA-DEP:
      description: "E-WA-DEP（502/503）Engine/底座依赖不可用；可重试 + 降级标注（实测枚举 httpStatus=502，503 为设计并列形态，§5.3）"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 502, errorCode: "E-WA-DEP", message: "SSE 进度通道(P-4/F10-16)不可用，请轮询 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-WA-NARRATIVE-NUM:
      description: "E-WA-NARRATIVE-NUM（500）数字一致性校验失败（abs 差/max ≤ 1e-4 之外）；重生成 ≤2 次；阻断发布 + 标注"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 500, errorCode: "E-WA-NARRATIVE-NUM", message: "叙述数字与计算值不一致，已阻断发布 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    E-INTERNAL:
      description: "E-INTERNAL（500）未分类内部错误；含 trace_id；禁回显堆栈（对卷 07 C159\"异常原文入体\"的同类预防）"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 500, errorCode: "E-INTERNAL", message: "内部错误 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }
    ECOS_WA_CALIBER_LOCKED:
      description: |
        （§5.3 表外第 12 枚举，WAgentErrorCodes.java:78 实测在位）
        ECOS_WA_CALIBER_LOCKED（409）Goal 口径被引用锁定，reviseGoal 专用（§5.2 #2 注记）。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
          example: { code: 409, errorCode: "ECOS_WA_CALIBER_LOCKED", message: "口径已被既有 Goal 引用，请走新版本 [traceId: 0a1b2c3d]", data: null, timestamp: 1760000000000, traceId: "0a1b2c3d" }

  schemas:
    ApiResponse:
      type: object
      description: |
        统一响应包裹（runtime/common-api ApiResponse.java 实测六字段：
        code/errorCode/message/data/timestamp/traceId）。
        卷10 §5.3 记"code/message/data/traceId"为设计口径；
        "traceId 实测不存在（卷06 C135 待补）"的脚注已被源码现状超越
        （ApiResponse.java:60 traceId 在位、:99 withTraceId()），本契约按实测登记。
        错误码语义承载于 errorCode（见 components.responses）。
      required: [code, message]
      properties:
        code:
          type: integer
          description: 与 HTTP 状态一致的业务码（成功 200 族）
          example: 200
        errorCode:
          type: string
          nullable: true
          description: E-* / ECOS_WA_* wire code；成功为 null
          enum:
            - E-VALIDATION
            - E-AUTH
            - E-POLICY
            - E-NOT-FOUND
            - E-WA-STATE
            - E-IDEMPOTENT-CONFLICT
            - E-RATE
            - E-WA-BUDGET
            - E-WA-DEP
            - E-WA-NARRATIVE-NUM
            - E-INTERNAL
            - ECOS_WA_CALIBER_LOCKED
        message:
          type: string
          description: 用户可读文案；错误模板必含 {traceId} 诊断码（WAgentErrorCodes 构造校验:89~90）
        data:
          nullable: true
          description: 业务载荷（各端点 data 设计级占位，字段收敛随 P-5 门禁）
        timestamp:
          type: integer
          format: int64
          nullable: true
        traceId:
          type: string
          nullable: true
          description: 全链诊断码（AiTraceSupport/ MDC；成功响应亦携带）

    # ── 以下 data/请求体 DTO 为设计级占位（additionalProperties: true）：
    #    字段级契约以 Controller DTO 实测收敛为 P-5 门禁事项，本文件不虚构字段清单 ──
    GoalCreateRequest:
      type: object
      description: 创建 Goal 请求（§5.2 #1；设计级占位，字段随 P-5 收敛）
      additionalProperties: true
    GoalReviseRequest:
      type: object
      description: 修订 Goal 请求（§5.2 #2；口径变更⇒新版本）
      additionalProperties: true
    Goal:
      type: object
      description: Goal 对象（WAgentGoalController 视图；字段清单随 P-5 收敛）
      additionalProperties: true
    QuestionCreateRequest:
      type: object
      description: 创建 Question 请求（§5.2 #3；含原始表述与槽位提示）
      additionalProperties: true
    Question:
      type: object
      description: Question 对象（含 disposition RESOLVED|CLARIFY 与 latest_run 摘要）
      additionalProperties: true
    RunStartRequest:
      type: object
      description: 启动 Run 请求（§5.2 #5；question 引用 + 预算/自动化上界）
      additionalProperties: true
    RunInputRequest:
      type: object
      description: awaiting_input 应答体（§5.2 #8；WAgentRunController RunInputRequest.input 实测形态）
      additionalProperties: true
    RunApprovalRequest:
      type: object
      description: 人工门审批凭证（§5.2 #9；approve/deny + 凭证校验）
      additionalProperties: true
    Run:
      type: object
      description: Run 快照（状态机态 + timeline；态集合=Run 六态，§4 状态机）
      additionalProperties: true
    KillSwitchRequest:
      type: object
      description: Kill Switch 设置（§5.2 #11；范围=租户/系统级，仅 admin）
      additionalProperties: true
    CandidateReviewRequest:
      type: object
      description: 四眼评审（§5.2 #19；通过/驳回 + 理由；禁批量语义在服务端强制）
      additionalProperties: true
    CandidatePublishRequest:
      type: object
      description: 发布请求（§5.2 #20；approval_token **必填**，缺失即 E-VALIDATION）
      required: [approval_token]
      properties:
        approval_token:
          type: string
          description: 人工审批凭证（F10-21 L3 无自动路径；F10-23 pre-commit 裁决前置）
      additionalProperties: true
    DecisionRecordRequest:
      type: object
      description: 决策留档（§5.2 #23；引用 pinned 评估记录 + baseline 槽位）
      additionalProperties: true
    ActionDraftRequest:
      type: object
      description: 行动草稿（§5.2 #24a；side_effect=draft，不落生产）
      additionalProperties: true
